<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Icônes du jeu</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --ink:#1B120C; --cream:#FFF6DC; --mango:#FFC93C; --txt:#2A1D12; --mute:#7A6650; --t:'Fredoka', system-ui, sans-serif; --b:'Nunito', system-ui, sans-serif; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:radial-gradient(70% 30% at 12% 0%, rgba(255,196,120,.25), transparent 70%), linear-gradient(180deg, #2a1a10, #140d08 60%); background-attachment:fixed; color:#FFF1D6; font-family:var(--b); }
.wrap{ padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px); max-width:520px; margin:0 auto; }
h1{ font:700 26px var(--t); margin:0; }
h2{ font:700 20px var(--t); margin:0; display:flex; align-items:center; gap:8px; }
h2 span{ font:900 12px var(--b); background:var(--mango); color:var(--txt); border:2px solid var(--ink); border-radius:99px; padding:2px 9px; }
p{ margin:6px 0 0; font-size:14px; line-height:1.4; color:#e9d6b6; }
.style{ margin-top:22px; padding:14px; border-radius:22px; border:2px solid #4a3a2a; background:rgba(0,0,0,.25); }
.style.on{ border-color:var(--mango); box-shadow:0 0 0 2px var(--mango); }
.grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px 6px; margin-top:12px; }
.ic{ display:flex; flex-direction:column; align-items:center; gap:4px; font:800 10.5px var(--b); color:#d9c3a0; text-align:center; }
.ic svg{ width:46px; height:46px; overflow:visible; }
.pick{ margin-top:12px; width:100%; border:3px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink); padding:11px; font:700 16px var(--t); background:var(--cream); color:var(--txt); cursor:pointer; }
.style.on .pick{ background:var(--mango); }
/* the preview inside the home screen */
.prev{ margin:26px 0 0; padding:14px; border-radius:22px; border:2px dashed #6b5236; }
.prev h3{ font:700 15px var(--t); margin:0 0 8px; color:#ffd9a0; }
.bar{ display:flex; justify-content:space-around; background:#1c1611; border:2px solid #4a3a2a; border-radius:22px; padding:6px; }
.bar span{ display:flex; flex-direction:column; align-items:center; gap:2px; font:800 10.5px var(--b); color:#bfae92; padding:4px 6px; border-radius:14px; }
.bar span.on{ background:var(--mango); color:var(--txt); }
.bar svg{ width:26px; height:26px; overflow:visible; }
.tiles{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
.tile{ background:var(--cream); color:var(--txt); border:3px solid var(--ink); border-radius:18px; box-shadow:0 4px 0 var(--ink); padding:10px 6px; text-align:center; }
.tile svg{ width:38px; height:38px; display:block; margin:0 auto 4px; overflow:visible; }
.tile b{ font:700 13.5px var(--t); }
.topb{ display:flex; gap:8px; justify-content:flex-end; margin-bottom:10px; }
.round{ width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); background:#fff; box-shadow:0 4px 0 var(--ink); display:grid; place-items:center; }
.round svg{ width:26px; height:26px; overflow:visible; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3bf"/><stop offset=".45" stop-color="#f1c257"/><stop offset="1" stop-color="#b47b1c"/></linearGradient>
</defs></svg>
<div class="wrap">
  <h1>Les icônes du jeu</h1>
  <p>Un seul dessin pour chaque icône, en trois styles. Choisis-en un : il remplacera tous les emojis (accueil, menus, réglages, effets). L’aperçu en bas montre ton choix dans l’accueil.</p>
  <div id="styles"></div>
  <div class="prev">
    <h3 id="prevT">Aperçu dans l’accueil</h3>
    <div class="topb" id="pvTop"></div>
    <div class="tiles" id="pvTiles"></div>
    <div class="bar" id="pvBar"></div>
  </div>
</div>
<script>
(()=>{
/* each icon: parts drawn on a 24 × 24 grid. m = the body, a = the accent (its colour), l = a line. c = its colour in the tile style */
const I = {
  accueil:{c:'#2FB36B', p:[['m','M3.5 11.2 L12 3.8 L20.5 11.2 V20.2 H14.2 V14.6 H9.8 V20.2 H3.5 Z'],['ai','M9.8 14.6 H14.2 V20.2 H9.8 Z'],['l','M2 12.4 L12 3.6 L22 12.4']]},
  profil:{c:'#3D7FD9', p:[['m','M12 3.6 a4.2 4.2 0 1 1 0 8.4 a4.2 4.2 0 1 1 0-8.4 Z'],['a','M3.8 20.4 c0-4.4 3.7-6.6 8.2-6.6 s8.2 2.2 8.2 6.6 Z']]},
  boutique:{c:'#E2558E', p:[['l','M8.6 8.4 V6.6 a3.4 3.4 0 0 1 6.8 0 V8.4'],['m','M4.6 8.2 H19.4 L18.3 20.4 H5.7 Z'],['ai','M4.6 8.2 H19.4 L19.1 11.4 H4.9 Z']]},
  decors:{c:'#8A4FD8', p:[['m','M12 3.2 a8.8 8.8 0 1 0 0 17.6 c1.5 0 2.2-.9 2.2-1.9 0-1.6-1.6-2.1 0-3.6 H17 a4 4 0 0 0 4-4 C21 6.8 17 3.2 12 3.2 Z'],['ai','M7.6 11 a1.6 1.6 0 1 1 0 .1 Z M9.6 6.9 a1.6 1.6 0 1 1 0 .1 Z M14.4 6.6 a1.6 1.6 0 1 1 0 .1 Z']]},
  reglages:{c:'#6B7A8F', p:[['l','M4 7 H20 M4 12 H20 M4 17 H20'],['m','M9 4.8 a2.2 2.2 0 1 1 0 4.4 a2.2 2.2 0 1 1 0-4.4 Z M15.4 9.8 a2.2 2.2 0 1 1 0 4.4 a2.2 2.2 0 1 1 0-4.4 Z M7.4 14.8 a2.2 2.2 0 1 1 0 4.4 a2.2 2.2 0 1 1 0-4.4 Z']]},
  cloche:{c:'#F0A020', p:[['m','M5.6 16.4 V11 a6.4 6.4 0 0 1 12.8 0 V16.4 L20 18.4 H4 Z'],['a','M9.8 19.4 a2.2 2.2 0 0 0 4.4 0 Z'],['l','M12 2.6 V4.4']]},
  jetons:{c:'#D9A21B', p:[['m','M12 3.4 a8.6 8.6 0 1 1 0 17.2 a8.6 8.6 0 1 1 0-17.2 Z'],['ai','M12 6.6 a5.4 5.4 0 1 1 0 10.8 a5.4 5.4 0 1 1 0-10.8 Z'],['l','M12 9 V15 M10 10.6 h3.4 M10 13.4 h3.4']]},
  defi:{c:'#E24B4A', p:[['m','M3.8 6 H20.2 V20.2 H3.8 Z'],['ai','M3.8 6 H20.2 V10 H3.8 Z'],['l','M8 3.6 V7.6 M16 3.6 V7.6'],['ai','M13.6 13.2 H17 V16.6 H13.6 Z']]},
  lecon:{c:'#3D7FD9', p:[['m','M6.2 11.6 V16 c0 1.7 2.9 3.2 5.8 3.2 s5.8-1.5 5.8-3.2 V11.6 L12 14.4 Z'],['a','M1.8 9.2 L12 4.2 L22.2 9.2 L12 14.2 Z'],['l','M20.2 10.2 V15.4']]},
  regles:{c:'#9A6B3F', p:[['m','M3.6 5.2 c3-1.1 6-1.1 8.4.9 V20.4 c-2.4-2-5.4-2-8.4-.9 Z'],['a','M20.4 5.2 c-3-1.1-6-1.1-8.4.9 V20.4 c2.4-2 5.4-2 8.4-.9 Z']]},
  enligne:{c:'#1BA3A3', p:[['m','M12 3 a9 9 0 1 1 0 18 a9 9 0 1 1 0-18 Z'],['li','M3.2 12 H20.8 M12 3 c3.2 3.2 3.2 14.8 0 18 M12 3 c-3.2 3.2-3.2 14.8 0 18 M4.6 7.4 H19.4 M4.6 16.6 H19.4']]},
  code:{c:'#F07B2B', p:[['m','M7.8 7.4 a4.6 4.6 0 1 1 0 9.2 a4.6 4.6 0 1 1 0-9.2 Z M12 10.8 H21 V13.4 H19 V15.8 H16.6 V13.4 H12 Z'],['ai','M7.8 10.4 a1.6 1.6 0 1 1 0 3.2 a1.6 1.6 0 1 1 0-3.2 Z']]},
  carre:{c:'#C8283A', p:[['m','M3.6 7.4 L9.8 5.6 L13.3 18.4 L7.1 20.2 Z'],['m','M10.6 3.8 H18.6 V17.6 H10.6 Z'],['ai','M14.6 8.6 c.7-1 2.3-.7 2.3.6 0 1.2-1.6 2.1-2.3 2.8-.7-.7-2.3-1.6-2.3-2.8 0-1.3 1.6-1.6 2.3-.6 Z']]},
  quartier:{c:'#D9A21B', p:[['m','M3 8 L7.6 12 L12 4.8 L16.4 12 L21 8 L19 17.6 H5 Z'],['a','M5 17.6 H19 V20.4 H5 Z'],['a','M12 3.2 a1.4 1.4 0 1 1 0 .1 Z M3 6.6 a1.2 1.2 0 1 1 0 .1 Z M21 6.6 a1.2 1.2 0 1 1 0 .1 Z']]},
  league:{c:'#2B4FC0', p:[['l','M7 6 H4.4 a2.6 2.6 0 0 0 2.8 4.6 M17 6 h2.6 a2.6 2.6 0 0 1-2.8 4.6'],['m','M7 3.8 H17 V9 a5 5 0 0 1-10 0 Z'],['m','M10.6 13.8 H13.4 V17 H10.6 Z'],['a','M7.4 17 H16.6 V20.4 H7.4 Z']]},
  installer:{c:'#2FB36B', p:[['m','M7.2 2.4 H16.8 a1.6 1.6 0 0 1 1.6 1.6 V20 a1.6 1.6 0 0 1-1.6 1.6 H7.2 a1.6 1.6 0 0 1-1.6-1.6 V4 a1.6 1.6 0 0 1 1.6-1.6 Z'],['ai','M10 18.4 H14 V19.4 H10 Z'],['li','M12 6.4 V13.4 M9 10.6 L12 13.6 L15 10.6']]},
  compte:{c:'#2F80ED', p:[['m','M12 2.8 L19.2 5.8 V11 c0 5-3 8.6-7.2 10.2 C7.8 19.6 4.8 16 4.8 11 V5.8 Z'],['li','M8.4 11.8 L11 14.4 L15.8 9.4']]},
  cadenas:{c:'#6B7A8F', p:[['l','M8.4 11 V8 a3.6 3.6 0 0 1 7.2 0 V11'],['m','M5.6 10.8 H18.4 V20.4 H5.6 Z'],['ai','M12 13.4 a1.5 1.5 0 0 1 .7 2.8 V17.6 H11.3 V16.2 A1.5 1.5 0 0 1 12 13.4 Z']]},
  foudre:{c:'#F2B705', p:[['m','M13.4 2 L4.8 13.4 H11 L9.8 22 L19.2 9.8 H13 Z']]},
  hasard:{c:'#8A4FD8', p:[['m','M6 3.6 H18 a2.4 2.4 0 0 1 2.4 2.4 V18 a2.4 2.4 0 0 1-2.4 2.4 H6 A2.4 2.4 0 0 1 3.6 18 V6 A2.4 2.4 0 0 1 6 3.6 Z'],['ai','M8.2 6.8 a1.4 1.4 0 1 1 0 2.8 a1.4 1.4 0 1 1 0-2.8 Z M15.8 6.8 a1.4 1.4 0 1 1 0 2.8 a1.4 1.4 0 1 1 0-2.8 Z M12 10.6 a1.4 1.4 0 1 1 0 2.8 a1.4 1.4 0 1 1 0-2.8 Z M8.2 14.4 a1.4 1.4 0 1 1 0 2.8 a1.4 1.4 0 1 1 0-2.8 Z M15.8 14.4 a1.4 1.4 0 1 1 0 2.8 a1.4 1.4 0 1 1 0-2.8 Z']]},
  meteorite:{c:'#F07B2B', p:[['l','M3 3 L10 10 M7 2.4 L12.4 7.8 M2.4 7 L7.8 12.4'],['m','M15 9.4 a5.6 5.6 0 1 1 0 11.2 a5.6 5.6 0 1 1 0-11.2 Z'],['ai','M13 13 a1.4 1.4 0 1 1 0 .1 Z M16.8 16.6 a1 1 0 1 1 0 .1 Z']]},
  claque:{c:'#F0A020', p:[['m','M7.4 20.6 C5.2 18.6 3.4 15.8 3.4 13.8 c0-1.2 1.6-1.6 2.4-.6 L7.4 15 V6.8 a1.4 1.4 0 0 1 2.8 0 V11 V4.6 a1.4 1.4 0 0 1 2.8 0 V11 V5.6 a1.4 1.4 0 0 1 2.8 0 V11.6 V8.2 a1.4 1.4 0 0 1 2.8 0 V14 c0 4.2-2.6 7.2-6.6 7.2 C10 21.2 8.6 21.2 7.4 20.6 Z'],['l','M20.6 4.6 L22 3.2 M21.4 7.6 H23 M18.4 3 L19 1.4']]},
  feu:{c:'#E24B4A', p:[['m','M12 2 c1 4 6.2 6.2 6.2 12.2 a6.2 6.2 0 0 1-12.4 0 c0-3 2-5 3-6 0 2 1 3 2 3 -1-3 0-6.2 1.2-9.2 Z'],['ai','M12 12.6 c1 1.6 2.6 2.6 2.6 4.6 a2.6 2.6 0 0 1-5.2 0 c0-1.2.8-2 1.6-2.6 0 .8.4 1.2 1 1.2 -.4-1.2 0-2.2 0-3.2 Z']]}
};
const ORDER = Object.keys(I);
const LABEL = {accueil:'Accueil', profil:'Profil', boutique:'Boutique', decors:'Décors', reglages:'Réglages', cloche:'Notifications', jetons:'Jetons', defi:'Défi du jour', lecon:'La leçon', regles:'Les règles', enligne:'En ligne', code:'Code ami', carre:'Carré', quartier:'Tout le quartier', league:'League', installer:'Installer', compte:'Compte certifié', cadenas:'Verrouillé', foudre:'Effet foudre', hasard:'Au hasard', meteorite:'Météorite', claque:'Claque', feu:'Cartes en feu'};
// three ways to draw the same shapes
function draw(name, style){
  const ic = I[name], P = ic.p;
  if(style==='A'){ // drawn: cream body, coloured accent, ink outline and a hard shadow, like the cards of the game
    // the lines get a cream underlay: readable on the night as on the cream cards
    // (li = a line on the body, ai = an accent on the body: drawn like the others here)
    return '<svg viewBox="0 0 24 24" style="filter:drop-shadow(1.4px 1.8px 0 #1B120C)">'+P.map(([k, d])=> k[0]==='l'
      ? '<path d="'+d+'" fill="none" stroke="#FFF6DC" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="'+d+'" fill="none" stroke="#1B120C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'
      : '<path d="'+d+'" fill="'+(k[0]==='a' ? ic.c : '#FFF6DC')+'" stroke="#1B120C" stroke-width="1.5" stroke-linejoin="round"/>').join('')+'</svg>';
  }
  if(style==='B'){ // gold: the line of the new logo, softly glowing on the night
    return '<svg viewBox="0 0 24 24" style="filter:drop-shadow(0 0 3px rgba(241,194,87,.45))">'+P.map(([k, d])=> k[0]==='l'
      ? '<path d="'+d+'" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
      : '<path d="'+d+'" fill="'+(k[0]==='a' ? 'url(#gold)' : 'rgba(241,194,87,.12)')+'" fill-opacity="'+(k[0]==='a' ? '.55' : '1')+'" stroke="url(#gold)" stroke-width="1.4" stroke-linejoin="round"/>').join('')+'</svg>';
  }
  // C: game tiles — a glossy coloured square, the white glyph on it
  const id = 'g'+name+Math.random().toString(36).slice(2, 6);
  return '<svg viewBox="-6 -6 36 36" style="filter:drop-shadow(0 2.4px 0 rgba(0,0,0,.45))"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+ic.c+'" stop-opacity=".75"/><stop offset=".5" stop-color="'+ic.c+'"/><stop offset="1" stop-color="'+ic.c+'" style="filter:brightness(.7)"/></linearGradient></defs>'
    +'<rect x="-5" y="-5" width="34" height="34" rx="10" fill="'+ic.c+'"/><rect x="-5" y="-5" width="34" height="34" rx="10" fill="url(#'+id+')"/>'
    +'<path d="M-5 5 a10 10 0 0 1 10-10 H19 a10 10 0 0 1 10 10 V7 C18 11 6 11 -5 7 Z" fill="#fff" opacity=".18"/>'
    +'<rect x="-5" y="-5" width="34" height="34" rx="10" fill="none" stroke="#1B120C" stroke-width="1.4"/>'
    // on the white body, the details take the colour of the tile; around it, they stay white
    +P.map(([k, d])=> k==='l' ? '<path d="'+d+'" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
      : k==='li' ? '<path d="'+d+'" fill="none" stroke="'+ic.c+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'
      : '<path d="'+d+'" fill="'+(k==='ai' ? ic.c : k==='a' ? 'rgba(255,255,255,.62)' : '#fff')+'"/>').join('')+'</svg>';
}
const STYLES = [['A', 'Dessinées', 'Contour noir et ombre nette, comme les cartes et les boutons du jeu. Lisibles sur fond clair comme sur fond sombre.'],
  ['B', 'Dorées', 'Le trait d’or du nouveau logo, qui brille doucement dans la nuit. Chic, sobre, « table des grands ».'],
  ['C', 'Pastilles', 'Un carré coloré et brillant par icône, comme les grands jeux mobiles : chaque rubrique a sa couleur.']];
let cur = 'A';
document.getElementById('styles').innerHTML = STYLES.map(([k, n, d])=> '<section class="style'+(k===cur ? ' on' : '')+'" data-s="'+k+'"><h2>'+n+' <span>Style '+k+'</span></h2><p>'+d+'</p><div class="grid">'
  + ORDER.map(name=> '<div class="ic">'+draw(name, k)+LABEL[name]+'</div>').join('') + '</div><button class="pick" data-s="'+k+'">Voir le style '+k+' dans l’accueil</button></section>').join('');
function preview(){
  document.getElementById('prevT').textContent = 'Aperçu dans l’accueil · style '+cur;
  document.getElementById('pvTop').innerHTML = ['cloche', 'compte'].map(n=> '<span class="round">'+draw(n, cur)+'</span>').join('');
  document.getElementById('pvTiles').innerHTML = [['defi', 'Défi du jour'], ['lecon', 'La leçon'], ['regles', 'Les règles']].map(([n, l])=> '<div class="tile">'+draw(n, cur)+'<b>'+l+'</b></div>').join('');
  document.getElementById('pvBar').innerHTML = [['accueil', 'Accueil'], ['profil', 'Profil'], ['boutique', 'Boutique'], ['decors', 'Décors'], ['reglages', 'Réglages']].map(([n, l], i)=> '<span'+(i ? '' : ' class="on"')+'>'+draw(n, cur)+l+'</span>').join('');
  document.querySelectorAll('.style').forEach(s=> s.classList.toggle('on', s.dataset.s===cur));
}
document.addEventListener('click', e=>{ const b = e.target.closest('.pick'); if(b){ cur = b.dataset.s; preview(); document.querySelector('.prev').scrollIntoView({behavior:'smooth', block:'end'}); } });
preview();
})();
</script>
</body></html>
