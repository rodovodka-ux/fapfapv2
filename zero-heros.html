<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Zéro à Héros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  /* Layout: one phone screen, full-bleed on a phone, framed in the middle of the night on a computer. The game's drawn style: ink outlines, hard shadows, mango. */
  :root{
    --night:#0b0807; --ink:#1B120C; --cream:#FFF6DC; --paper:#FFF8E7; --mango:#FFC93C; --mango-d:#E8A817;
    --red:#E24B4A; --green:#2FB36B; --blue:#3D7FD9; --pink:#F06BA8; --mute:#a99a86; --txt:#2A1D12;
    --screen:#120d0a; --glass:rgba(255,246,220,.07); --line:rgba(255,246,220,.14);
    --f-t:'Fredoka','Trebuchet MS',system-ui,sans-serif; --f-b:'Nunito','Segoe UI',system-ui,sans-serif;
    color-scheme:dark;
  }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--night); color:var(--cream); font:600 15px/1.4 var(--f-b); -webkit-tap-highlight-color:transparent; overflow:hidden; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  :focus-visible{ outline:3px solid var(--mango); outline-offset:2px; }
  .stage{ height:100%; display:grid; place-items:center; padding-left:max(0px, env(safe-area-inset-left,0px)); padding-right:max(0px, env(safe-area-inset-right,0px)); }
  .phone{ position:relative; width:100%; height:100%; background:var(--screen); overflow:hidden; display:flex; flex-direction:column; }
  @media (min-width:560px){ .phone{ width:400px; height:min(840px, calc(100% - 40px)); border-radius:46px; border:10px solid #050403; box-shadow:0 0 0 3px #2a211b, 0 40px 120px rgba(255,201,60,.08); } }

  /* ---------- the status bar ---------- */
  .sb{ display:flex; align-items:center; gap:8px; padding:10px max(18px, env(safe-area-inset-left,0px)) 6px; font:700 13px var(--f-b); font-variant-numeric:tabular-nums; color:var(--cream); flex:none; z-index:6; }
  .sb .when{ color:var(--mango); }
  .sb .sp{ flex:1; }
  .sb .bat{ display:inline-flex; align-items:center; gap:4px; }
  .sb .bat i{ width:22px; height:11px; border:2px solid var(--cream); border-radius:3px; position:relative; }
  .sb .bat i::after{ content:""; position:absolute; inset:1px; right:40%; background:var(--cream); border-radius:1px; }

  /* ---------- scenes (title, hero, call, home, app) ---------- */
  .scene{ position:absolute; inset:0; display:flex; flex-direction:column; }
  .scene[hidden]{ display:none !important; }
  .rain{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; opacity:.5; }

  .btn{ border:3px solid var(--ink); background:var(--mango); color:var(--ink); border-radius:18px; padding:13px 20px; font:700 17px var(--f-t); box-shadow:0 5px 0 var(--ink); }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  .btn.ghost{ background:var(--paper); }
  .btn.red{ background:var(--red); color:#fff; }
  .btn.green{ background:var(--green); color:#fff; }
  .btn[disabled]{ opacity:.45; }

  /* title */
  .title{ align-items:center; justify-content:center; text-align:center; gap:22px; padding:24px; background:radial-gradient(120% 70% at 50% 10%, rgba(255,201,60,.18), transparent 60%), var(--night); }
  .logo{ position:relative; font:700 64px/0.9 var(--f-t); color:var(--mango); -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:0 6px 0 var(--ink), 0 0 40px rgba(255,201,60,.35); letter-spacing:.01em; }
  .logo small{ display:block; font:600 20px var(--f-t); color:var(--cream); -webkit-text-stroke:0; text-shadow:none; letter-spacing:.3em; margin-bottom:8px; }
  .title p{ max-width:300px; color:var(--mute); margin:0; }
  .title .adult{ font:800 11px var(--f-b); letter-spacing:.14em; text-transform:uppercase; color:var(--red); border:2px solid var(--red); border-radius:99px; padding:4px 10px; }

  /* hero */
  .hero{ padding:18px max(18px, env(safe-area-inset-left,0px)) 22px; gap:14px; overflow-y:auto; background:var(--night); }
  .hero h2{ font:700 26px var(--f-t); margin:6px 0 0; text-wrap:balance; }
  .hero .lab{ font:800 11px var(--f-b); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
  .seg{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .seg button{ border:3px solid var(--ink); border-radius:16px; background:var(--paper); color:var(--ink); padding:12px; font:700 16px var(--f-t); box-shadow:0 4px 0 var(--ink); }
  .seg button[aria-pressed="true"]{ background:var(--mango); }
  .faces{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .faces button{ border:3px solid var(--ink); border-radius:20px; background:#2b211a; padding:6px; box-shadow:0 4px 0 var(--ink); aspect-ratio:1; }
  .faces button[aria-pressed="true"]{ background:var(--mango); }
  .faces svg{ width:100%; height:100%; display:block; }
  .ph-me{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field input{ border:3px solid var(--ink); border-radius:14px; padding:12px 14px; font:700 17px var(--f-b); background:var(--paper); color:var(--ink); }

  /* the call */
  .call{ align-items:center; padding:30px 22px 26px; gap:10px; background:linear-gradient(180deg, #1f2b3a, #0b0d12 70%); text-align:center; }
  .call .who{ font:700 28px var(--f-t); margin-top:24px; }
  .call .sub{ color:var(--mute); font-weight:700; }
  .call .ava{ width:116px; height:116px; border-radius:50%; border:4px solid var(--ink); background:#d9e6f2; box-shadow:0 0 0 6px rgba(255,255,255,.08); display:grid; place-items:center; color:var(--ink); }
  .call .ava.ringing{ animation:ring 1.2s ease-in-out infinite; }
  @keyframes ring{ 0%,100%{ box-shadow:0 0 0 6px rgba(255,255,255,.08); } 50%{ box-shadow:0 0 0 22px rgba(255,255,255,0); } }
  .call .lines{ flex:1; width:100%; display:flex; flex-direction:column; justify-content:flex-end; gap:8px; overflow:hidden; }
  .call .ln{ text-align:left; background:var(--glass); border:1px solid var(--line); border-radius:16px; padding:10px 13px; animation:up .35s ease-out both; }
  .call .ln b{ display:block; font:800 11px var(--f-b); letter-spacing:.12em; text-transform:uppercase; color:var(--mango); margin-bottom:2px; }
  .call .ln.me{ background:rgba(255,201,60,.12); border-color:rgba(255,201,60,.3); }
  .call .ln.big{ font:700 22px var(--f-t); text-align:center; color:var(--mango); }
  .call .acts{ display:flex; gap:36px; justify-content:center; padding-top:8px; }
  .round{ width:72px; height:72px; border-radius:50%; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); display:grid; place-items:center; }
  .round svg{ width:30px; height:30px; }
  .timer{ font:700 14px var(--f-b); font-variant-numeric:tabular-nums; color:var(--mute); }
  @keyframes up{ from{ opacity:0; transform:translateY(10px); } }

  /* home */
  .home{ background:radial-gradient(90% 50% at 80% 0%, rgba(240,107,168,.14), transparent 60%), radial-gradient(90% 50% at 0% 30%, rgba(255,201,60,.10), transparent 60%), var(--screen); }
  .home-body{ flex:1; overflow-y:auto; padding:6px max(16px, env(safe-area-inset-left,0px)) 16px; display:flex; flex-direction:column; gap:12px; }
  .w{ border:3px solid var(--ink); border-radius:22px; background:var(--paper); color:var(--txt); box-shadow:0 5px 0 var(--ink); padding:12px 14px; }
  .w .k{ font:800 11px var(--f-b); letter-spacing:.12em; text-transform:uppercase; color:#7A6650; }
  .w-million .big{ font:700 30px var(--f-t); font-variant-numeric:tabular-nums; line-height:1.1; }
  .w-million .big small{ font:700 15px var(--f-t); color:#7A6650; }
  .bar{ height:14px; border-radius:99px; border:2.5px solid var(--ink); background:#f1e3c4; overflow:hidden; margin-top:8px; }
  .bar i{ display:block; height:100%; background:var(--mango); border-right:2.5px solid var(--ink); min-width:4px; transition:width .6s; }
  .w-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .w-sis{ display:flex; gap:10px; align-items:center; }
  .w-sis .pic{ width:52px; height:52px; flex:none; }
  .mini{ display:flex; flex-direction:column; gap:5px; flex:1; min-width:0; }
  .mini span{ display:flex; justify-content:space-between; font:800 11px var(--f-b); color:#7A6650; }
  .mini .bar{ height:9px; margin:0; border-width:2px; }
  .mini .bar.h i{ background:var(--red); } .mini .bar.r i{ background:var(--pink); }
  .w-next{ display:flex; flex-direction:column; gap:3px; }
  .w-next b{ font:700 16px var(--f-t); line-height:1.15; }
  .w-next small{ color:#7A6650; font-weight:700; }
  .apps{ display:grid; grid-template-columns:repeat(4, 1fr); gap:14px 8px; padding:4px 2px; }
  .app{ background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:0; position:relative; }
  .app .ic{ width:58px; height:58px; border-radius:18px; border:3px solid var(--ink); box-shadow:0 4px 0 var(--ink); display:grid; place-items:center; }
  .app .ic svg{ width:28px; height:28px; }
  .app:active .ic{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .app span{ font:700 11.5px var(--f-b); color:var(--cream); }
  .badge{ position:absolute; top:-6px; right:calc(50% - 38px); min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--red); color:#fff; border:2.5px solid var(--ink); font:800 12px/17px var(--f-b); text-align:center; }
  .dock{ flex:none; padding:10px max(16px, env(safe-area-inset-left,0px)) max(14px, env(safe-area-inset-bottom,0px)); display:flex; gap:10px; align-items:center; border-top:1px solid var(--line); background:rgba(0,0,0,.35); }
  .dock .btn{ flex:1; font-size:16px; padding:12px 14px; }
  .dock .menu{ width:48px; height:48px; border-radius:16px; border:3px solid var(--ink); background:var(--paper); color:var(--ink); box-shadow:0 4px 0 var(--ink); display:grid; place-items:center; flex:none; }

  /* app pages */
  .page{ background:var(--screen); }
  .ph{ flex:none; display:flex; align-items:center; gap:10px; padding:6px max(14px, env(safe-area-inset-left,0px)) 10px; }
  .ph .back{ width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); background:var(--paper); color:var(--ink); box-shadow:0 4px 0 var(--ink); font:700 26px/1 var(--f-t); display:grid; place-items:center; padding-bottom:3px; flex:none; }
  .ph h2{ margin:0; font:700 22px var(--f-t); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ph .pic{ width:40px; height:40px; flex:none; }
  .pb{ flex:1; overflow-y:auto; padding:4px max(14px, env(safe-area-inset-left,0px)) 18px; display:flex; flex-direction:column; gap:10px; }
  .row{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:18px; background:var(--glass); border:1px solid var(--line); text-align:left; width:100%; }
  .row .pic{ width:46px; height:46px; flex:none; }
  .row .t{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .row .t b{ font:700 16px var(--f-t); }
  .row .t small{ color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
  .row .n{ min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--red); color:#fff; font:800 12px/22px var(--f-b); text-align:center; }
  .row.new{ border-color:rgba(255,201,60,.45); background:rgba(255,201,60,.08); }
  .empty{ margin:auto; text-align:center; color:var(--mute); max-width:260px; padding:24px 0; }
  .h3{ font:800 11px var(--f-b); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin:8px 2px 0; }

  /* the conversation */
  .msgs{ flex:1; overflow-y:auto; padding:8px max(14px, env(safe-area-inset-left,0px)) 10px; display:flex; flex-direction:column; gap:6px; }
  .m{ max-width:80%; padding:9px 13px; border-radius:20px; border-bottom-left-radius:6px; background:#2b211a; align-self:flex-start; white-space:pre-wrap; word-wrap:break-word; animation:up .25s ease-out both; }
  .m.me{ align-self:flex-end; background:var(--mango); color:var(--ink); border-bottom-left-radius:20px; border-bottom-right-radius:6px; font-weight:700; }
  .m.sys{ align-self:center; background:none; color:var(--mute); font-size:12px; font-weight:800; padding:4px; }
  .typing{ align-self:flex-start; display:flex; gap:4px; padding:12px 14px; background:#2b211a; border-radius:20px; }
  .typing i{ width:7px; height:7px; border-radius:50%; background:var(--mute); animation:blink 1s infinite; } .typing i:nth-child(2){ animation-delay:.15s; } .typing i:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 50%{ opacity:.25; } }
  .choices{ flex:none; display:flex; flex-direction:column; gap:8px; padding:10px max(14px, env(safe-area-inset-left,0px)) max(14px, env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); }
  .choices .lab{ font:800 11px var(--f-b); letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
  .choices button{ text-align:left; border:3px solid var(--ink); background:var(--paper); color:var(--ink); border-radius:16px; padding:11px 14px; font:700 15px var(--f-b); box-shadow:0 4px 0 var(--ink); }
  .choices button:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .free{ flex:none; display:flex; gap:8px; padding:8px max(14px, env(safe-area-inset-left,0px)) max(12px, env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); }
  .choices:not([hidden]) + .free{ border-top:0; padding-top:0; }
  .free input{ flex:1; min-width:0; height:46px; padding:0 16px; border-radius:23px; border:2px solid #3a2e25; background:#1c1511; color:var(--cream); font:700 16px var(--f-b); }
  .free input:focus{ border-color:var(--mango); outline:none; }
  .free .btn{ width:46px; height:46px; padding:0; border-radius:50%; font-size:18px; flex:none; box-shadow:0 3px 0 var(--ink); }

  /* bank */
  .solde{ text-align:center; padding:8px 0 4px; }
  .solde .big{ font:700 44px var(--f-t); color:var(--mango); font-variant-numeric:tabular-nums; -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:0 4px 0 var(--ink); }
  .solde small{ color:var(--mute); font-weight:800; }
  .tx{ display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:10px 12px; border-bottom:1px solid var(--line); }
  .tx b{ font:700 15px var(--f-b); } .tx small{ color:var(--mute); font-weight:700; grid-column:1; }
  .tx em{ font-style:normal; font:800 15px var(--f-b); font-variant-numeric:tabular-nums; grid-row:1 / span 2; align-self:center; }
  .tx em.p{ color:var(--green); } .tx em.n{ color:var(--red); }
  .card{ border:3px solid var(--ink); border-radius:20px; background:var(--paper); color:var(--txt); box-shadow:0 5px 0 var(--ink); padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .card .k{ font:800 11px var(--f-b); letter-spacing:.12em; text-transform:uppercase; color:#7A6650; }
  .bill{ display:grid; grid-template-columns:1fr auto; gap:6px 10px; font-weight:700; }
  .bill em{ font-style:normal; font-variant-numeric:tabular-nums; font-weight:800; text-align:right; }
  .bill .due{ color:var(--red); font-size:12px; grid-column:1 / -1; margin-top:-4px; }
  .gauge{ display:flex; flex-direction:column; gap:4px; }
  .gauge span{ display:flex; justify-content:space-between; font:800 13px var(--f-b); }
  .gauge .bar.h i{ background:var(--red); } .gauge .bar.r i{ background:var(--pink); }

  /* map */
  .map{ position:relative; border:3px solid var(--ink); border-radius:22px; overflow:hidden; box-shadow:0 5px 0 var(--ink); background:#d9c9a3; }
  .map svg{ display:block; width:100%; height:auto; }
  .pin{ cursor:pointer; }

  /* the notification banner and the sheet */
  .notif{ position:absolute; left:10px; right:10px; top:calc(8px + env(safe-area-inset-top,0px)); z-index:20; display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:20px; background:rgba(40,32,26,.96); border:1px solid var(--line); box-shadow:0 12px 30px rgba(0,0,0,.5); transform:translateY(-140%); transition:transform .35s cubic-bezier(.2,.9,.3,1.2); text-align:left; }
  .notif.on{ transform:none; }
  .notif .pic{ width:40px; height:40px; flex:none; }
  .notif .t{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .notif .t b{ font:700 14px var(--f-t); } .notif .t small{ color:var(--cream); opacity:.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
  .sheet{ position:absolute; inset:0; z-index:30; display:flex; align-items:flex-end; background:rgba(0,0,0,.55); }
  .sheet[hidden]{ display:none !important; }
  .sheet .in{ width:100%; background:var(--paper); color:var(--txt); border-top:3px solid var(--ink); border-radius:26px 26px 0 0; padding:18px max(18px, env(safe-area-inset-left,0px)) max(18px, env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:12px; animation:up .3s ease-out both; }
  .sheet h3{ margin:0; font:700 22px var(--f-t); }
  .sheet p{ margin:0; }
  .sheet .story{ font-style:italic; color:#4a3a2a; }
  .sheet .btns{ display:flex; flex-direction:column; gap:10px; }
  .delta{ display:flex; gap:8px; flex-wrap:wrap; }
  .delta span{ font:800 12px var(--f-b); padding:4px 10px; border-radius:99px; border:2px solid var(--ink); background:#fff; }
  .delta .up{ background:#d9f4e4; } .delta .dn{ background:#fbdcdc; }

  .blackout{ position:absolute; inset:0; z-index:40; background:#000; display:grid; place-items:center; text-align:center; padding:24px; font:700 22px var(--f-t); color:var(--cream); opacity:0; pointer-events:none; transition:opacity .6s; }
  .blackout.on{ opacity:1; pointer-events:auto; }
  .blackout small{ display:block; font:700 13px var(--f-b); color:var(--mango); letter-spacing:.2em; text-transform:uppercase; margin-bottom:8px; }

  /* ---------- the entrance exam (Duolingo style) ---------- */
  .exam{ background:radial-gradient(100% 50% at 50% 0%, rgba(255,201,60,.12), transparent 60%), var(--night); }
  .ex-top{ flex:none; display:flex; align-items:center; gap:12px; padding:12px max(16px, env(safe-area-inset-left,0px)) 6px; }
  .ex-x{ width:40px; height:40px; border-radius:50%; border:0; background:none; color:var(--mute); font:700 26px/1 var(--f-t); flex:none; }
  .ex-prog{ flex:1; height:16px; border-radius:99px; background:#2b211a; overflow:hidden; border:2px solid #000; }
  .ex-prog i{ display:block; height:100%; width:0; background:var(--green); border-radius:99px; transition:width .45s cubic-bezier(.3,1.4,.5,1); box-shadow:inset 0 -4px 0 rgba(0,0,0,.18), inset 0 4px 0 rgba(255,255,255,.25); }
  .ex-streak{ display:flex; align-items:center; gap:4px; font:700 16px var(--f-t); color:var(--mango); min-width:44px; justify-content:flex-end; font-variant-numeric:tabular-nums; }
  .ex-streak.hot{ animation:pop .4s ease-out; }
  @keyframes pop{ 50%{ transform:scale(1.35); } }
  .ex-body{ flex:1; overflow-y:auto; padding:8px max(16px, env(safe-area-inset-left,0px)) 12px; display:flex; flex-direction:column; gap:14px; }
  .ex-lvl{ font:800 11px var(--f-b); letter-spacing:.14em; text-transform:uppercase; color:var(--mango); }
  .ex-judge{ display:flex; gap:10px; align-items:flex-end; }
  .ex-judge .pic{ width:58px; height:58px; flex:none; }
  .ex-judge .bub{ position:relative; background:var(--paper); color:var(--ink); border:3px solid var(--ink); border-radius:18px; border-bottom-left-radius:4px; padding:10px 13px; font:700 17px/1.3 var(--f-t); box-shadow:0 4px 0 var(--ink); }
  .ex-cards{ display:flex; gap:10px; justify-content:center; align-items:flex-end; flex-wrap:wrap; padding:6px 0; }
  .ex-cards .lab{ width:100%; text-align:center; font:800 11px var(--f-b); letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
  .pc{ width:52px; height:74px; border-radius:9px; background:#fffdf6; border:2.5px solid var(--ink); box-shadow:0 3px 0 var(--ink); display:flex; flex-direction:column; justify-content:space-between; padding:4px 5px; color:var(--ink); font:700 17px/1 var(--f-t); }
  .pc.r{ color:#C6282B; }
  .pc .s{ font-size:24px; align-self:center; }
  .pc .b{ align-self:flex-end; } /* upright: an upside-down 6 reads as a 9 */
  .ex-opts{ display:flex; flex-direction:column; gap:10px; }
  .ex-opts.cardpick{ flex-direction:row; justify-content:center; gap:14px; }
  .opt{ text-align:left; border:3px solid #3a2e25; background:#1c1511; color:var(--cream); border-radius:18px; padding:14px 16px; font:700 16px var(--f-b); box-shadow:0 4px 0 #3a2e25; }
  .opt[aria-pressed="true"]{ border-color:var(--blue); background:rgba(61,127,217,.18); box-shadow:0 4px 0 var(--blue); }

  return Math.max(0, Math.round(o - d.paid));
}

// The game reads what you mean (an excuse, a lie, love, money, an insult, Christelle…), then the character answers with
// written lines chosen by that meaning AND her mood of the moment (calm / tense / storm). Each meaning moves her gauges,
// some leave a memory, and what she already knows about you colours the answer.
// lower case, no accents, no apostrophes ("j ai", "j'ai" and "jai" read the same), stretched letters shortened ("bebeee")
const norm = s=> String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/['’`]/g, ' ')
  .replace(/\b([jtlmdcsnq]) (?=[aeiouyh])/g, '$1').replace(/(.)\1{2,}/g, '$1$1').replace(/\s+/g, ' ').trim();
// [meaning, pattern on the normalised text]; the first that matches wins, so the strongest meanings come first
const INTENTS = [
  ['breakup', /(je te quitte|c'?est fini|on arrete|on se separe|je romps|laisse[- ]moi tranquille|fous[- ]moi la paix|je ne veux plus de toi|adieu)/],
  ['insult', /(folle|tare|hysterique|idiote|conne|connasse|salope|pute|malade mentale|chiante|garce|sorciere|imbecile|gourde|betise de femme|ferme[- ]la|ta gueule)/],
  ['christelle', /christelle/],
  ['father', /(ton pere|ton papa|hubert|ton vieux|ton daron)/],
  ['sorry', /(pardon|desole|excuse|pardonne|j'?ai eu tort|je regrette|c'?est ma faute)/],
  ['deny', /(je (te |vous )?(le )?jure|c'?est pas vrai|c'?est faux|je n'?ai rien fait|j'?ai rien fait|tu (te )?trompes|tu exageres|je mens pas|je ne mens pas|n'?importe quoi)/],
  ['noMoney', /(pas d'?argent|pas (un )?rond|fauche|a sec|je n'?ai rien|j'?ai rien|pas de dos|pas les moyens|pas de sous|pas de do\b|je suis cass)/],
  ['offer', /(je (t'?|te )?(envoie|envoies|paie|paye|offre|donne)|je vais (t'?|te )?(envoyer|payer|offrir|donner)|cadeau|resto|restaurant|je t'?invite|on sort)/],
  ['night', /(viens (chez moi|dormir)|dormir (chez|ensemble)|passer la nuit|cette nuit ensemble|j'?ai envie de toi|calin|bisous partout)/],
  ['sister', /(princesse|ma soeur|ma petite soeur|hopital|operation|docteur|malade|clinique|soins)/],
  ['love', /(je t'?aime|t'?aime|tu me manques|mon coeur|ma cherie|cherie|ma reine|bebe|mon amour|❤|😘|🥰|😍|💕)/],
  ['greet', /^(salut|bonjour|bonsoir|cc|coucou|yo|hello|on dit quoi|on dit comment|mola|ma go|wesh|wey|weh|eh)\b/],
  ['compliment', /(belle|jolie|magnifique|canon|sexy|bombe|mignonne|ravissante|trop bien)/],
  ['where', /(tu es ou|t'?es ou|tu fais quoi|tu es avec qui|t'?es avec qui|ou es[- ]tu)/],
  ['cards', /\b(cartes?|fap|rall|veillee|la maison|tournoi|jouer|partie|tables?|mises?)\b/],
  ['police', /(police|boulot|travail|bureau|commissariat|collegue|enquete|rafle|controle)/],
  ['joke', /(😂|🤣|mdr|lol|haha|hihi|je rigole|je blague|c'?est une blague)/],
  ['ok', /^(ok|okay|d'?accord|dac|oui|non|mmm+|hmm+|si|ouais|bon)\W*$/],
];
const detect = text=>{ const t = norm(text);
  // a short "salut bébé" is a hello, not a declaration
  if(t.split(' ').length<=3 && INTENTS.find(x=> x[0]==='greet')[1].test(t)) return 'greet';
  for(const [k, re] of INTENTS) if(re.test(t)) return k; return /\?\s*$/.test(t) ? 'question' : 'unknown'; };

async function freeSend(pid, text){
  text = String(text||'').replace(/\s+/g, ' ').trim().slice(0, 200); if(!text) return;
  const th = thread(pid);
  // writing freely while she waits for an answer counts as your answer
  if(th.choices){ th.choices = null; th.pressed = 0; clearTimeout(drawThread.t); }
  th.msgs.push({who:'me', txt:text, d:S.day, m:S.m}); save(); drawThread(); renderHome();
  const book = CHAT[pid], k = detect(text), e = book[k] || book.unknown;
  const mood = S.pam.storm>=65 ? 's' : S.pam.storm>=45 ? 't' : 'c';
  // what she already knows about you comes first, once per memory
  const known = e.know ? Object.keys(e.know).find(m=> knows(m) && !(S.flags.said||{})[pid+k+m]) : null;
  let lines;
  if(known){ S.flags.said = S.flags.said || {}; S.flags.said[pid+k+known] = 1; lines = [e.know[known]]; }
  else {
    const pool = e[mood] || e.c; S.flags.turn = S.flags.turn || {};
    const i = S.flags.turn[pid+k+mood] = ((S.flags.turn[pid+k+mood] ?? -1) + 1) % pool.length;
    // in a storm she fires two or three lines in a row
    lines = mood==='s' && pool.length>1 ? pool.slice(i).concat(pool.slice(0, i)).slice(0, 2) : [pool[i]];
  }
  pam(e.fx[0], e.fx[1]); if(e.mem) remember(e.mem);
  await wait(500);
  if(mood==='s') await burst(pid, lines); else await say(pid, lines);
}

function drawThread(){
  const pid = openThread; if(!pid) return;
  const th = thread(pid), box = $('#appBody');
  th.unread = 0; save();
  box.innerHTML = th.msgs.map(m=> '<div class="m'+(m.who==='me' ? ' me' : '')+'">'+esc(m.txt)+'</div>').join('') || '<div class="empty">Pas encore de message.</div>';
  box.scrollTop = box.scrollHeight;
  const c = $('#appChoices');
  if(th.choices && th.choices.length){
    c.hidden = false; c.innerHTML = '<span class="lab">Ta réponse</span>';
    th.choices.forEach(ch=>{ const b = document.createElement('button'); b.textContent = ch.t;
      // an answer that costs money stays visible but locked when you can't pay: you see what you can't afford
      if(ch.need && S.cash < ch.need){ b.disabled = true; b.style.opacity = '.5'; b.textContent += ' · il te manque '+fmt(ch.need - S.cash); }
      else b.onclick = ()=> answer(pid, ch);
      c.appendChild(b); });
    // Amour hates waiting: an open conversation left unanswered for 20 s gets a jab, once per question
    clearTimeout(drawThread.t);
    if(pid==='pamela' && !th.pressed){ drawThread.t = setTimeout(()=>{ if(openThread==='pamela' && thread('pamela').choices && !thread('pamela').pressed){ thread('pamela').pressed = 1; pam(0, +4); say('pamela', [hot() ? 'Tu écris la Bible ou quoi ?? 😤' : 'Tu écris un roman ? 🙄']); } }, 20000); }
  } else c.hidden = true;
  // the free-writing bar lives outside the redrawn part, so what you are typing is never wiped by her next message
  $('#appFree').hidden = !CHAT[pid];
  if(CHAT[pid] && th.choices) c.querySelector('.lab').textContent = 'Ta réponse · ou écris ce que tu veux en bas';
}
async function answer(pid, ch){
  const th = thread(pid); th.choices = null; th.pressed = 0; clearTimeout(drawThread.t); th.msgs.push({who:'me', txt:ch.t, d:S.day, m:S.m}); save(); drawThread(); renderHome();
  await ANSWERS[ch.a]();
}

}

// every morning the money moves on its own: the tontine takes its share (or pays you on your turn), debts grow and remind you
function morning(){
  const t = S.tontine;
  if(t && t.active){
    // your turn pays the whole pot… but you keep paying every day until everyone has had theirs
    if(S.day === t.joined + t.turn && !t.got){ t.got = 1; tx(t.daily*t.of, 'Tontine · c’est ton tour !'); setTimeout(()=> say('clarisse', ['C’est ton tour 🎉', fmt(t.daily*t.of)+' versés.', 'N’oublie pas : tu cotises jusqu’au jour '+(t.joined + t.of)+', comme tout le monde 🙏']), 1800); }
    else if(S.day > t.joined + t.of){ t.active = 0; }
    else if(S.cash >= t.daily){ t.paid++; tx(-t.daily, 'Tontine de Clarisse · cotisation'); }
    else { t.missed = (t.missed||0) + 1; remember('tontine_missed');
      setTimeout(()=> say('clarisse', t.got ? ['Tu as touché ta part et tu ne cotises plus ?', 'Tout le quartier va le savoir. Ton nom, c’est tout ce que tu as.'] : ['Tu n’as pas cotisé ce matin.', 'Encore une fois et tu perds ton tour. Les règles, c’est les règles.']), 1800); }
  }
  // the hospital does not wait: an unpaid advance costs her health every morning
  if(S.day > S.hosp.advDue && S.hosp.paid < S.hosp.advance){ nudge('hp', -4);
    setTimeout(()=> say('mengue', ['Bonjour. L’avance de '+fmt(S.hosp.advance - S.hosp.paid)+' n’est toujours pas réglée.', 'Sans elle, nous réduisons ses soins. Je suis désolé.']), 3200); }
  // two days without a visit and she feels it
  if(S.day >= 4 && S.day - (S.lastVisit || 1) >= 2){ nudge('rel', -4); if(!S.flags['miss'+S.day]){ S.flags['miss'+S.day] = 1; setTimeout(()=> say('princesse', ['Tu m’as oubliée ?']), 4200); } }
  debtsLeft().forEach(d=>{
    if(!d.rate) return;
    if(S.day === d.due - 1) setTimeout(()=> say('grosventre', ['Bonjour mon fils 😊', 'Demain, c’est le jour. '+fmt(owed(d))+'. Je sais que tu n’as pas oublié.']), 2400);
    if(S.day > d.due) setTimeout(()=> burst('grosventre', ['Mon fils 😊', 'Tu as oublié quelque chose ?', 'Aujourd’hui c’est '+fmt(owed(d))+'.', 'Les intérêts, eux, n’oublient jamais.']), 2400);
  });
  save();
}
// the time is the player's: one moment at a time, or straight to the next meeting (nothing is skipped: each moment's news still arrives)
async function skipTo(day, m){
  while(S.day<day || (S.day===day && S.m<m)) await advance(true);
}
async function advance(fast){
  if(busy) return; busy = 1;
  // leaving the partner on "Vu": the moment passes without your answer, and that is an answer too
  const pt = S.threads[PART()], ghosted = !!(pt && pt.choices);
  if(ghosted){ pt.choices = null; pt.pressed = 0; remember('ghosted'); if(PART()==='pamela') pam(-4, +15); else pam(-1, 0); }
  const last = S.m===3;
  S.m = last ? 0 : S.m + 1; if(last){ S.day++; S.hosp.owed += S.hosp.daily; }
  save();
  const bl = $('#black'); bl.innerHTML = '<div><small>Jour '+S.day+'</small>'+MOMENTS[S.m]+'</div>'; bl.classList.add('on');
  await wait(fast ? 650 : 1100); bl.classList.remove('on');
  renderHome(); show('scHome'); busy = 0;
  if(ghosted) PART()==='pamela' ? burst('pamela', hot() ? ['Vu.', 'Tu as vu et tu ne réponds pas ?', 'Ok.', 'Tu vas voir.'] : ['Vu…', 'Bon. Ok. 😒']) : say('yowale', ['lol ok 😂']);
  if(last) morning();
  if(S.day===1 && S.m===3) beat('part1');
  if(S.day===2 && S.m===0) beat('day2am');
  if(S.day===2 && S.m===1) beat('day2pm');
  // from day 4 on, the act 2 moments ('d5m1' = day 5, afternoon)
  if(S.day>=4) beat('d'+S.day+'m'+S.m);
}

function examStart(){
  EX = {qs:[], i:0, score:0, streak:0, best:0, byLvl:[0,0,0,0,0], sel:null, done:false};
  // the answers are shuffled every sitting (true / false stays in that order), so the right one is never always in the same place
  const mix = q=>{
    const key = q.pick ? 'pick' : 'o', list = q[key];
    if(q.keep || (!q.pick && list.length===2)) return q;
    const order = pickRand(list.map((_, i)=> i), list.length);
    return Object.assign({}, q, {[key]: order.map(i=> list[i]), a: order.indexOf(q.a)});
  };
  // each level: 2 questions made from fresh cards + 2 written ones, those not yet seen first
  const seen = seenGet();
  for(let l = 0; l < 5; l++){
    const gens = GEN_BY_LVL[l], nGen = 2;
    const made = Array.from({length:nGen}, (_, k)=> GEN[gens[k % gens.length]]());
    const fixed = QB.filter(q=> q.l===l), fresh = pickRand(fixed.filter(q=> !seen.includes(q.id)), 4 - nGen);
    const fill = fresh.length < 4 - nGen ? pickRand(fixed.filter(q=> !fresh.includes(q)), 4 - nGen - fresh.length) : [];
    EX.qs.push(...pickRand(made.concat(fresh, fill), 4).map(mix));
  }
  seenAdd(EX.qs.filter(q=> q.id).map(q=> q.id));
  show('scExam'); examDraw();
}

let AC = null, ringT = 0;
function audio(){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function tone(f, t0, d, v){ if(!SFX.on) return; const a = audio(); if(!a) return; const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0, a.currentTime+t0); g.gain.linearRampToValueAtTime(v, a.currentTime+t0+.02); g.gain.exponentialRampToValueAtTime(.001, a.currentTime+t0+d); o.connect(g); g.connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+d+.05); }
function ring(on){ clearInterval(ringT); if(!on) return; const r = ()=>{ [0, .18].forEach(t=>{ tone(880, t, .16, .08); tone(660, t+.09, .14, .06); }); buzz(); }; r(); ringT = setInterval(r, 1600); }
function buzz(){ try{ navigator.vibrate && navigator.vibrate([60, 40, 60]); }catch(e){} if(SFX.on) { tone(1320, 0, .12, .05); tone(1760, .1, .14, .04); } }
// ---- the real recordings of the game and of the Dossiers de Nkolbisson (sfx/ and sfx/amb/, CC0 / Kenney), loaded on first use.
// One-shots (thunder, chips, cards, a horn) and loops that fade in and out (rain, the bar, the siren). Missing files stay silent.
const SFX = (()=>{
  const FILES = {pluie:'sfx/amb/pluie_toit.mp3', orage:'sfx/amb/pluie_orage.mp3', tonnerre:'sfx/amb/tonnerre.mp3', sirene:'sfx/amb/sirene.mp3', klaxon:'sfx/amb/klaxon.mp3',
    bar:'sfx/amb/bar.mp3', insectes:'sfx/amb/insectes.mp3', jetons:'sfx/chips-stack-3.wav', jeton:'sfx/chip-lay-2.wav', melange:'sfx/card-shuffle.wav', carte:'sfx/card-place-2.wav', eventail:'sfx/card-fan-1.wav'};
  let on = true; try{ on = localStorage.getItem('zh-snd')!=='0'; }catch(e){}
  const buf = {}, loops = {};
  let bus = null;
  const ctx = ()=>{ const a = audio(); if(a && !bus){ bus = a.createGain(); bus.gain.value = on ? 1 : 0; bus.connect(a.destination); } return a; };
  const load = n=> buf[n] ? Promise.resolve(buf[n]) : fetch(FILES[n]).then(r=> r.ok ? r.arrayBuffer() : Promise.reject()).then(b=> new Promise((ok, no)=> ctx().decodeAudioData(b, ok, no))).then(b=> (buf[n] = b)).catch(()=> null);
  function play(n, vol, delay){ const a = ctx(); if(!a || !on) return; load(n).then(b=>{ if(!b) return; const s = a.createBufferSource(), g = a.createGain(); s.buffer = b; g.gain.value = vol==null ? .5 : vol; s.connect(g); g.connect(bus); s.start(a.currentTime + (delay||0)); }); }
  function loop(n, vol, fade){ const a = ctx(); if(!a || loops[n]) return; loops[n] = {pending:1};
    load(n).then(b=>{ const L = loops[n]; if(!b || !L || !L.pending) return; const s = a.createBufferSource(), g = a.createGain(); s.buffer = b; s.loop = true; g.gain.value = 0; s.connect(g); g.connect(bus);
      s.start(0, Math.random()*b.duration); g.gain.linearRampToValueAtTime(vol==null ? .25 : vol, a.currentTime + (fade||2)); loops[n] = {s, g}; }); }
  function stop(n, fade){ const L = loops[n]; if(!L) return; delete loops[n]; if(!L.g) return; const a = ctx(); L.g.gain.cancelScheduledValues(a.currentTime); L.g.gain.setValueAtTime(L.g.gain.value, a.currentTime); L.g.gain.linearRampToValueAtTime(0, a.currentTime + (fade||1.5)); setTimeout(()=>{ try{ L.s.stop(); }catch(e){} }, (fade||1.5)*1000 + 100); }
  function toggle(){ on = !on; try{ localStorage.setItem('zh-snd', on ? '1' : '0'); }catch(e){} const a = ctx(); if(bus && a) bus.gain.setTargetAtTime(on ? 1 : 0, a.currentTime, .1); $('#snd').textContent = on ? '🔊' : '🔇'; $('#snd').setAttribute('aria-label', on ? 'Couper le son' : 'Remettre le son'); }
  return {play, loop, stop, toggle, get on(){ return on; }};
})();
$('#snd').textContent = SFX.on ? '🔊' : '🔇';
$('#snd').onclick = e=>{ e.stopPropagation(); audio(); SFX.toggle(); };

// ===================== the rain =====================
(function rain(){
  const c = $('#rain'), x = c.getContext('2d'); let W = 0, H = 0, drops = [];
  const size = ()=>{ W = c.width = c.offsetWidth; H = c.height = c.offsetHeight; drops = Array.from({length:70}, ()=> ({x:Math.random()*W, y:Math.random()*H, v:6+Math.random()*6, l:8+Math.random()*12})); };
  size(); addEventListener('resize', size);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  (function f(){ x.clearRect(0, 0, W, H); x.strokeStyle = 'rgba(200,215,235,.35)'; x.lineWidth = 1.2; x.beginPath();
    drops.forEach(d=>{ x.moveTo(d.x, d.y); x.lineTo(d.x-2, d.y+d.l); d.y += d.v; d.x -= .6; if(d.y>H){ d.y = -20; d.x = Math.random()*W; } }); x.stroke(); requestAnimationFrame(f); })();
})();

let FILM = null;
function film(list, done){
  const el = document.createElement('div'); el.className = 'film'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Cinématique');
  const bgs = [...new Set(list.map(p=> p.bg))];
  el.innerHTML = bgs.map(b=> '<div class="bg" data-bg="'+b+'" style="background-image:url('+ART+b+'.webp)"></div>').join('')+
    '<div class="vig"></div><div class="bar t"></div><div class="bar b"></div>'+
    list.map((p, i)=>{ const w = !p.who ? [] : Array.isArray(p.who[0]) ? p.who : [p.who];
      return w.map(([n, side])=> '<img class="who '+side+'" data-i="'+i+'" alt="" src="'+(n==='rall' ? 'art/rall.jpg' : ART+'buste-'+n+'.webp')+'">').join('')+
        '<div class="shot'+(p.ttl ? ' ttl' : '')+(p.pos ? ' '+p.pos : '')+'" aria-live="polite">'+p.html+'</div>'; }).join('')+
    '<div class="dots">'+'<i></i>'.repeat(list.length)+'</div><button type="button" class="skip">Passer ›</button>';
  $('#phone').appendChild(el);
  const shots = el.querySelectorAll('.shot'), dots = el.querySelectorAll('.dots i');
  let i = -1, t = 0, beep = 0, loopOn = null, ended = false;
  const go = k=>{ if(k >= list.length) return; clearTimeout(t); clearInterval(beep); i = k; const p = list[k];
    shots.forEach((s, j)=> s.classList.toggle('on', j===k)); dots.forEach((d, j)=> d.classList.toggle('on', j<=k));
    el.querySelectorAll('.bg').forEach(b=> b.classList.toggle('on', b.dataset.bg===p.bg));
    el.querySelectorAll('.who').forEach(w=> w.classList.toggle('on', +w.dataset.i===k));
    tone(49, 0, 2, .12);   // a low hit on every plan
    if(p.sfx){ if(p.sfx[0]==='bip') beep = setInterval(()=> tone(1046, 0, .12, .05), 1100); else SFX.play(p.sfx[0], p.sfx[1]); }
    if(p.loop !== loopOn){ if(loopOn) SFX.stop(loopOn); loopOn = p.loop || null; if(loopOn) SFX.loop(loopOn, .22); }
    if(k < list.length - 1) t = setTimeout(()=> go(k + 1), 2600 + shots[k].textContent.length*55);
    else el.querySelector('.skip').hidden = true; };
  const end = ()=>{ if(ended) return; ended = true; clearTimeout(t); clearInterval(beep); if(loopOn) SFX.stop(loopOn); SFX.stop('orage', 2);
    el.style.transition = 'opacity .9s'; el.style.opacity = '0'; setTimeout(()=>{ el.remove(); FILM = null; done && done(); }, 900); };
  el.addEventListener('click', e=>{ if(e.target.closest('[data-go]')) return end(); if(e.target.closest('.skip')) return go(list.length - 1); if(i < list.length - 1) go(i + 1); });
  FILM = {end};
  audio(); SFX.loop('orage', .2, 3);
  requestAnimationFrame(()=> el.classList.add('on')); setTimeout(()=> go(0), 700);
}

  if(k==='night1'){ devState(1, 3, {beats:BEATS(['sis1', 'rall1'])}); beat('part1'); }
  if(k==='day2am'){ devState(2, 0, {beats:BEATS(['sis1', 'rall1', 'part1'])}); beat('day2am'); }
  if(k==='day2pm'){ devState(2, 1, {mem:{lie_hosp:{d:1, m:3}}, beats:BEATS(['sis1', 'rall1', 'part1', 'day2am', 'part2'])}); beat('day2pm'); }
  if(k==='veillee'){ devState(2, 2, {beats:BEATS(['sis1', 'rall1', 'part1', 'day2am', 'part2', 'day2pm', 'part3'])}); openApp('carte', 'veillee'); }
  if(k==='exam'){ devState(3, 0, {beats:BEATS(['sis1', 'rall1', 'part1', 'day2am', 'part2', 'day2pm', 'part3'])}); examStart(); }
  if(k==='day3' || k==='inscription' || k==='debt'){
    devState(3, k==='day3' ? 0 : 2, {cash:4000, ledger:[{a:4000, l:'Départ (mode développeur)', d:3, m:0}], flags:{examPassed:17},
      agenda:[{id:'inscription', day:3, m:2, place:'maison', title:'Inscription à la Maison', who:'tsala', stake:'5 000 à payer · puis ta première table'}],
      beats:BEATS(['sis1', 'rall1', 'part1', 'day2am', 'part2', 'day2pm', 'part3'].concat(k==='day3' ? [] : ['day3money']))});
    if(k==='day3') beat('day3money');
    if(k==='inscription'){ borrow('grosventre', 'Prêt de Papa Gros-Ventre', 10000, 0.10, 7); remember('loan_gv'); openApp('carte', 'inscription'); }
    if(k==='debt'){ borrow('grosventre', 'Prêt de Papa Gros-Ventre', 10000, 0.10, 7); remember('loan_gv'); S.agenda[0].done = 1; S.day = 10; S.m = 3; save(); advance(); }
  }
  if(/^a2/.test(k)) act2Jump(k);
}
// act 2 starts from a member of the Maison with 8 000, the advance paid, every act 1 moment already lived
function act2Jump(k){
  const A1 = ['sis1', 'rall1', 'part1', 'day2am', 'part2', 'day2pm', 'part3', 'day3money'];
  const at = {a2:[4, 0, 'd4m0'], a2d4pm:[4, 1, 'd4m1'], a2mado:[5, 0, 'd5m0'], a2armand:[5, 1, 'd5m1'], a2colis:[6, 1, null], a2tournoi:[6, 2, null], a2d7:[7, 0, 'd7m0'], a2end:[10, 3, 'd10m3'], a2endR:[10, 3, 'd10m3']}[k];
  const passed = Object.keys(ACT2).filter(b=>{ const [, d, m] = b.match(/d(\d+)m(\d)/).map(Number); return d < at[0] || (d===at[0] && m < at[1]); });
  const mem = {member:{d:3, m:2}, kept_deal:{d:4, m:2}};
  if(k==='a2end') Object.assign(mem, {delivered:{d:6, m:1}, opened_parcel:{d:6, m:1}});
  if(k==='a2endR') mem.refused_parcel = {d:5, m:1};
  if(k==='a2d7' && PART()==='pamela') mem.informer = {d:4, m:1};
  if(k==='a2d7' && PART()==='yowale') mem.daryl_loan2 = {d:4, m:1};
  const agenda = [];
  if(k==='a2colis') agenda.push({id:'colis', day:6, m:1, place:'mokolo', title:'Le colis d’Armand', who:'armand', stake:'10 000 à la livraison · ne l’ouvre pas'});
  if(k==='a2tournoi') agenda.push({id:'tournoi', day:6, m:2, place:'maison', title:'Tournoi du samedi', who:'tsala', stake:'3 000 l’entrée · 15 000 au vainqueur'});
  devState(at[0], at[1], {cash:8000, ledger:[{a:8000, l:'Départ de l’acte 2 (mode développeur)', d:at[0], m:at[1]}], flags:{examPassed:17}, mem, agenda, lastVisit:at[0],
    hosp:{advance:50000, advDue:3, daily:3000, owed:0, paid:50000}, tontine:k==='a2d7' ? {daily:1000, turn:10, of:10, joined:3, paid:3, active:1} : undefined,
    beats:BEATS(A1.concat(passed))});
  S.contacts.push('tsala', 'mado', 'armand'); save();
  if(at[2]) beat(at[2]);
  if(k==='a2d7') setTimeout(()=> beat('d7m1'), 9000);
  if(agenda.length) openApp('carte', agenda[0].id);
}
function devPanel(){
  sheet('<h3>🛠 Mode développeur</h3><p>Va directement à une scène. La partie en cours est remplacée.</p>'+
    '<div class="seg" id="devSex"><button type="button" data-f="0" aria-pressed="'+(!S.hero.fem)+'">Héros homme (Amour)</button><button type="button" data-f="1" aria-pressed="'+(!!S.hero.fem)+'">Héroïne (Daryl Bleu Magic)</button></div>'+
    '<div class="seg" id="devMood"><button type="button" data-s="30" aria-pressed="'+(S.pam.storm<45)+'">Amour calme</button><button type="button" data-s="75" aria-pressed="'+(S.pam.storm>=65)+'">Amour en orage</button></div>'+
    '<div class="btns" style="max-height:46vh;overflow-y:auto">'+DEV_JUMPS.map(([k, l])=> '<button class="btn ghost" data-j="'+k+'" style="text-align:left">'+esc(l)+'</button>').join('')+
    '<button class="btn" id="devCash">+10 000 jetons</button><button class="btn ghost" id="devClose">Fermer</button></div>');
  $('#devSex').onclick = e=>{ const b = e.target.closest('[data-f]'); if(!b) return; S.hero.fem = +b.dataset.f; save(); devPanel(); };
  $('#devMood').onclick = e=>{ const b = e.target.closest('[data-s]'); if(!b) return; S.pam.storm = +b.dataset.s; S.pam.love = +b.dataset.s<45 ? 75 : 55; save(); devPanel(); };
  $('#sheetIn').querySelectorAll('[data-j]').forEach(b=> b.onclick = ()=>{ audio(); devJump(b.dataset.j); });
  $('#devCash').onclick = ()=>{ tx(10000, 'Mode développeur · +10 000'); closeSheet(); };
  $('#devClose').onclick = closeSheet;
}
