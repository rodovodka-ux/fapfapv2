<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Zéro à Héros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  /* Layout: one phone screen, full-bleed on a phone, framed in the middle of the night on a computer. The game's drawn style: ink outlines, hard shadows, mango. */
  :root{
    --night:#0b0807; --ink:#1B120C; --cream:#FFF6DC; --paper:#FFF8E7; --mango:#FFC93C; --mango-d:#E8A817;
    --red:#E24B4A; --green:#2FB36B; --blue:#3D7FD9; --pink:#F06BA8; --mute:#a99a86; --txt:#2A1D12;
    --screen:#120d0a; --glass:rgba(255,246,220,.07); --line:rgba(255,246,220,.14);
    --f-t:'Fredoka','Trebuchet MS',system-ui,sans-serif; --f-b:'Nunito','Segoe UI',system-ui,sans-serif;
    color-scheme:dark;
  }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--night); color:var(--cream); font:600 15px/1.4 var(--f-b); -webkit-tap-highlight-color:transparent; overflow:hidden; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  :focus-visible{ outline:3px solid var(--mango); outline-offset:2px; }
  .stage{ height:100%; display:grid; place-items:center; padding-left:max(0px, env(safe-area-inset-left,0px)); padding-right:max(0px, env(safe-area-inset-right,0px)); }
  .phone{ position:relative; width:100%; height:100%; background:var(--screen); overflow:hidden; display:flex; flex-direction:column; }
  @media (min-width:560px){ .phone{ width:400px; height:min(840px, calc(100% - 40px)); border-radius:46px; border:10px solid #050403; box-shadow:0 0 0 3px #2a211b, 0 40px 120px rgba(255,201,60,.08); } }

  /* ---------- the status bar ---------- */
  .sb{ display:flex; align-items:center; gap:8px; padding:10px max(18px, env(safe-area-inset-left,0px)) 6px; font:700 13px var(--f-b); font-variant-numeric:tabular-nums; color:var(--cream); flex:none; z-index:6; }
  .sb .when{ color:var(--mango); }
  .sb .sp{ flex:1; }
  .sb .bat{ display:inline-flex; align-items:center; gap:4px; }
  .sb .bat i{ width:22px; height:11px; border:2px solid var(--cream); border-radius:3px; position:relative; }
  .sb .bat i::after{ content:""; position:absolute; inset:1px; right:40%; background:var(--cream); border-radius:1px; }

  /* ---------- scenes (title, hero, call, home, app) ---------- */
  .scene{ position:absolute; inset:0; display:flex; flex-direction:column; }
  .scene[hidden]{ display:none !important; }
  .rain{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; opacity:.5; }

  .btn{ border:3px solid var(--ink); background:var(--mango); color:var(--ink); border-radius:18px; padding:13px 20px; font:700 17px var(--f-t); box-shadow:0 5px 0 var(--ink); }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  .btn.ghost{ background:var(--paper); }
  .btn.red{ background:var(--red); color:#fff; }
  .btn.green{ background:var(--green); color:#fff; }
  .btn[disabled]{ opacity:.45; }

  /* title */
  .title{ align-items:center; justify-content:center; text-align:center; gap:22px; padding:24px; background:radial-gradient(120% 70% at 50% 10%, rgba(255,201,60,.18), transparent 60%), var(--night); }
  .logo{ position:relative; font:700 64px/0.9 var(--f-t); color:var(--mango); -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:0 6px 0 var(--ink), 0 0 40px rgba(255,201,60,.35); letter-spacing:.01em; }
  .logo small{ display:block; font:600 20px var(--f-t); color:var(--cream); -webkit-text-stroke:0; text-shadow:none; letter-spacing:.3em; margin-bottom:8px; }
  .title p{ max-width:300px; color:var(--mute); margin:0; }
  .title .adult{ font:800 11px var(--f-b); letter-spacing:.14em; text-transform:uppercase; color:var(--red); border:2px solid var(--red); border-radius:99px; padding:4px 10px; }

  /* hero */
  .hero{ padding:18px max(18px, env(safe-area-inset-left,0px)) 22px; gap:14px; overflow-y:auto; background:var(--night); }
  .hero h2{ font:700 26px var(--f-t); margin:6px 0 0; text-wrap:balance; }
  .hero .lab{ font:800 11px var(--f-b); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
  .seg{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .seg button{ border:3px solid var(--ink); border-radius:16px; background:var(--paper); color:var(--ink); padding:12px; font:700 16px var(--f-t); box-shadow:0 4px 0 var(--ink); }
  .seg button[aria-pressed="true"]{ background:var(--mango); }
  .faces{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .faces button{ border:3px solid var(--ink); border-radius:20px; background:#2b211a; padding:6px; box-shadow:0 4px 0 var(--ink); aspect-ratio:1; }
  .faces button[aria-pressed="true"]{ background:var(--mango); }
  .faces svg{ width:100%; height:100%; display:block; }
  .ph-me{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field input{ border:3px solid var(--ink); border-radius:14px; padding:12px 14px; font:700 17px var(--f-b); background:var(--paper); color:var(--ink); }

  /* the call */
  .call{ align-items:center; padding:30px 22px 26px; gap:10px; background:linear-gradient(180deg, #1f2b3a, #0b0d12 70%); text-align:center; }
  .call .who{ font:700 28px var(--f-t); margin-top:24px; }
  .call .sub{ color:var(--mute); font-weight:700; }
  .call .ava{ width:116px; height:116px; border-radius:50%; border:4px solid var(--ink); background:#d9e6f2; box-shadow:0 0 0 6px rgba(255,255,255,.08); display:grid; place-items:center; color:var(--ink); }
  .call .ava.ringing{ animation:ring 1.2s ease-in-out infinite; }
  @keyframes ring{ 0%,100%{ box-shadow:0 0 0 6px rgba(255,255,255,.08); } 50%{ box-shadow:0 0 0 22px rgba(255,255,255,0); } }
  .call .lines{ flex:1; width:100%; display:flex; flex-direction:column; justify-content:flex-end; gap:8px; overflow:hidden; }
  .call .ln{ text-align:left; background:var(--glass); border:1px solid var(--line); border-radius:16px; padding:10px 13px; animation:up .35s ease-out both; }
  .call .ln b{ display:block; font:800 11px var(--f-b); letter-spacing:.12em; text-transform:uppercase; color:var(--mango); margin-bottom:2px; }
  .call .ln.me{ background:rgba(255,201,60,.12); border-color:rgba(255,201,60,.3); }
  .call .ln.big{ font:700 22px var(--f-t); text-align:center; color:var(--mango); }
  .call .acts{ display:flex; gap:36px; justify-content:center; padding-top:8px; }
  .round{ width:72px; height:72px; border-radius:50%; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); display:grid; place-items:center; }
  .round svg{ width:30px; height:30px; }
  .timer{ font:700 14px var(--f-b); font-variant-numeric:tabular-nums; color:var(--mute); }
  @keyframes up{ from{ opacity:0; transform:translateY(10px); } }

  /* home */
  .home{ background:radial-gradient(90% 50% at 80% 0%, rgba(240,107,168,.14), transparent 60%), radial-gradient(90% 50% at 0% 30%, rgba(255,201,60,.10), transparent 60%), var(--screen); }
  .home-body{ flex:1; overflow-y:auto; padding:6px max(16px, env(safe-area-inset-left,0px)) 16px; display:flex; flex-direction:column; gap:12px; }
  .w{ border:3px solid var(--ink); border-radius:22px; background:var(--paper); color:var(--txt); box-shadow:0 5px 0 var(--ink); padding:12px 14px; }
  .w .k{ font:800 11px var(--f-b); letter-spacing:.12em; text-transform:uppercase; color:#7A6650; }
  .w-million .big{ font:700 30px var(--f-t); font-variant-numeric:tabular-nums; line-height:1.1; }
  .w-million .big small{ font:700 15px var(--f-t); color:#7A6650; }
  .bar{ height:14px; border-radius:99px; border:2.5px solid var(--ink); background:#f1e3c4; overflow:hidden; margin-top:8px; }
  .bar i{ display:block; height:100%; background:var(--mango); border-right:2.5px solid var(--ink); min-width:4px; transition:width .6s; }
  .w-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  /* the time: where you are in the 30 days, in the day, and what is coming */
  .w-time{ display:flex; flex-direction:column; gap:8px; text-align:left; width:100%; }
  .tm-top{ display:flex; align-items:center; gap:8px; }
  .tm-id{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .tm-day{ font:700 26px var(--f-t); line-height:1; font-variant-numeric:tabular-nums; }
  .tm-day small{ font:700 14px var(--f-t); color:#7A6650; }
  .tm-wd{ font:800 12px var(--f-b); color:#7A6650; flex:1; min-width:0; }
  .tm-left{ flex:none; font:800 11.5px var(--f-b); padding:3px 8px; border-radius:99px; border:2px solid var(--ink); background:#fff3d6; white-space:nowrap; }
  .tm-left.hot{ background:var(--red); color:#fff; }
  .tm-mom{ display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; }
  .tm-mom span{ font:800 10.5px var(--f-b); text-align:center; padding:4px 0; border-radius:10px; border:2px solid #d8c7a2; color:#9a8868; white-space:nowrap; }
  .tm-mom span.past{ background:#eadcbc; border-color:#eadcbc; color:#b3a17e; text-decoration:line-through; }
  .tm-mom span.now{ background:var(--mango); border-color:var(--ink); color:var(--ink); box-shadow:0 2px 0 var(--ink); }
  .tm-strip{ display:grid; grid-template-columns:repeat(30, 1fr); gap:2px; align-items:end; }
  .tm-strip i{ height:12px; border-radius:3px; background:#efe2c3; position:relative; }
  .tm-strip i.sat{ background:#e2cfa5; }
  .tm-strip i.past{ background:#7A6650; }
  .tm-strip i.now{ height:18px; background:var(--mango); outline:2px solid var(--ink); }
  .tm-strip i.dl::after{ content:''; position:absolute; left:50%; top:-6px; width:6px; height:6px; margin-left:-3px; border-radius:50%; background:var(--red); border:1.5px solid var(--ink); }
  .tm-strip i.op{ background:var(--red); }
  .tm-next{ font:800 12px var(--f-b); color:var(--txt); display:flex; gap:6px; align-items:center; }
  .tm-next em{ font-style:normal; color:var(--red); white-space:nowrap; }
  .tm-next b{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-row{ display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px dashed #d8c7a2; }
  .cal-row .when{ flex:none; width:74px; font:800 11px var(--f-b); color:#7A6650; text-transform:uppercase; letter-spacing:.06em; }
  .cal-row .when.hot{ color:var(--red); }
  .cal-row b{ display:block; font:700 15px var(--f-t); }
  .cal-row small{ color:#7A6650; font-weight:700; }
  .cal-g{ display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; margin:4px 0 6px; }
  .cal-g .h{ font:800 10px var(--f-b); color:#7A6650; text-align:center; text-transform:uppercase; }
  .cal-g i{ font:700 13px/30px var(--f-t); font-style:normal; text-align:center; border-radius:9px; background:#f3e7cb; position:relative; color:var(--txt); }
  .cal-g i.past{ background:transparent; color:#b3a17e; text-decoration:line-through; }
  .cal-g i.now{ background:var(--mango); outline:2.5px solid var(--ink); }
  .cal-g i.op{ background:var(--red); color:#fff; }
  .cal-g i.dl::after{ content:''; position:absolute; right:3px; top:3px; width:7px; height:7px; border-radius:50%; background:var(--red); border:1.5px solid var(--ink); }
  .w-sis{ display:flex; gap:10px; align-items:center; }
  .w-sis .pic{ width:52px; height:52px; flex:none; }
  .mini{ display:flex; flex-direction:column; gap:5px; flex:1; min-width:0; }
  .mini span{ display:flex; justify-content:space-between; font:800 11px var(--f-b); color:#7A6650; }
  .mini .bar{ height:9px; margin:0; border-width:2px; }
  .mini .bar.h i{ background:var(--red); } .mini .bar.r i{ background:var(--pink); }
  /* your status: what opens doors and what brings the police, always in sight */
  .w-stat{ display:grid; grid-template-columns:1fr 1fr; gap:8px 6px; align-content:center; padding:10px 10px; }
  .st{ display:flex; flex-direction:column; gap:0; min-width:0; }
  .st b{ font:700 17px var(--f-t); line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st span{ font:800 9px var(--f-b); letter-spacing:.06em; text-transform:uppercase; color:#7A6650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st b.hot{ color:var(--red); } .st b.ok{ color:var(--green); }
  .apps{ display:grid; grid-template-columns:repeat(5, 1fr); gap:14px 6px; padding:4px 2px; }
  /* the neighbourhood's news, one line, the newest first */
  .w-news{ display:flex; gap:8px; align-items:center; text-align:left; width:100%; padding:9px 12px; border-radius:16px; border:1px solid var(--line); background:rgba(255,246,220,.06); color:var(--cream); font:700 13px var(--f-b); }
  .w-news b{ flex:none; color:var(--mango); font:800 10.5px var(--f-b); letter-spacing:.1em; text-transform:uppercase; }
  .w-news span{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .w-news i{ flex:none; width:8px; height:8px; border-radius:50%; background:var(--red); font-style:normal; }
  /* what an action changed floats up for a moment: « Relation +6 », « Police +3 » */
  .fxs{ position:absolute; left:0; right:0; bottom:92px; display:flex; flex-wrap:wrap; justify-content:center; gap:6px; padding:0 16px; pointer-events:none; z-index:30; }
  .fx{ font:800 13px var(--f-b); padding:5px 10px; border-radius:99px; border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink); background:var(--paper); color:var(--ink); animation:fxUp 2.8s ease forwards; }
  .fx.up{ background:#d9f5e3; } .fx.dn{ background:#fde0df; }
  @keyframes fxUp{ 0%{ opacity:0; transform:translateY(14px) scale(.9); } 12%{ opacity:1; transform:none; } 80%{ opacity:1; } 100%{ opacity:0; transform:translateY(-26px); } }
  /* the sky of the phone follows the moment of the day */
  .home.m0{ background:radial-gradient(90% 55% at 80% 0%, rgba(255,201,60,.22), transparent 60%), radial-gradient(90% 50% at 0% 30%, rgba(61,127,217,.16), transparent 60%), var(--screen); }
  .home.m1{ background:radial-gradient(90% 55% at 80% 0%, rgba(255,150,60,.24), transparent 60%), radial-gradient(90% 50% at 0% 30%, rgba(255,201,60,.12), transparent 60%), var(--screen); }
  .home.m2{ background:radial-gradient(90% 55% at 80% 0%, rgba(240,107,168,.22), transparent 60%), radial-gradient(90% 50% at 0% 30%, rgba(124,77,255,.16), transparent 60%), var(--screen); }
  .home.m3{ background:radial-gradient(90% 55% at 80% 0%, rgba(80,90,200,.16), transparent 60%), #07060a; }
  /* Princesse's portrait follows her health */
  .w-sis .pic{ position:relative; transition:filter .6s; }
  .w-sis .pic.tired{ filter:saturate(.6) brightness(.95); }
  .w-sis .pic.weak{ filter:grayscale(.75) brightness(.85); }
  .w-sis .pic em{ position:absolute; right:-4px; bottom:-4px; font-style:normal; font-size:17px; }
  /* money counts up or down instead of jumping */
  .w-million .big.flash-up{ color:var(--green); } .w-million .big.flash-dn{ color:var(--red); }
  .app{ background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:0; position:relative; }
  .app .ic{ width:58px; height:58px; border-radius:18px; border:3px solid var(--ink); box-shadow:0 4px 0 var(--ink); display:grid; place-items:center; }
  .app .ic svg{ width:28px; height:28px; }
  .app:active .ic{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .app span{ font:700 11.5px var(--f-b); color:var(--cream); }
  .badge{ position:absolute; top:-6px; right:calc(50% - 38px); min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--red); color:#fff; border:2.5px solid var(--ink); font:800 12px/17px var(--f-b); text-align:center; }
  .dock{ flex:none; padding:10px max(16px, env(safe-area-inset-left,0px)) max(14px, env(safe-area-inset-bottom,0px)); display:flex; gap:10px; align-items:center; border-top:1px solid var(--line); background:rgba(0,0,0,.35); }
  .dock .btn{ flex:1; font-size:16px; padding:12px 10px; white-space:nowrap; }
  /* an action card: what it is, then what it gives (green), risks or costs (red), and how long it takes */
  .acts{ display:flex; flex-direction:column; gap:8px; }
  .act{ display:flex; flex-direction:column; gap:6px; text-align:left; padding:10px 12px; border:3px solid var(--ink); border-radius:16px; background:#fff; color:var(--txt); box-shadow:0 4px 0 var(--ink); font:700 15px var(--f-t); cursor:pointer; }
  .act:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .act.sale{ background:#fff0ef; }
  .chips{ display:flex; flex-wrap:wrap; gap:5px; }
  .chips i{ font:800 11.5px var(--f-b); font-style:normal; padding:2px 8px; border-radius:99px; background:#f1e3c4; color:#5c4a33; }
  .chips i.up{ background:#d9f5e3; color:#1a6b3d; } .chips i.dn{ background:#fde0df; color:#a3302f; }
  .swipe-back{ position:fixed; left:0; top:50%; z-index:200; width:44px; height:44px; margin-top:-22px; border-radius:50%; display:grid; place-items:center; background:rgba(255,246,220,.92); color:var(--ink); box-shadow:0 4px 14px rgba(0,0,0,.35); transform:translateX(-60px); opacity:0; pointer-events:none; }
  .swipe-back.go{ background:var(--mango); }
  .lab.qf{ font:800 11px var(--f-b); letter-spacing:.14em; text-transform:uppercase; color:#7A6650; margin-top:8px; }
  .dock .menu{ width:48px; height:48px; border-radius:16px; border:3px solid var(--ink); background:var(--paper); color:var(--ink); box-shadow:0 4px 0 var(--ink); display:grid; place-items:center; flex:none; }

  /* app pages */
  .page{ background:var(--screen); }
  .ph{ flex:none; display:flex; align-items:center; gap:10px; padding:6px max(14px, env(safe-area-inset-left,0px)) 10px; }
  .ph .back{ width:44px; height:44px; border-radius:50%; border:3px solid var(--ink); background:var(--paper); color:var(--ink); box-shadow:0 4px 0 var(--ink); font:700 26px/1 var(--f-t); display:grid; place-items:center; padding-bottom:3px; flex:none; }
  .ph h2{ margin:0; font:700 22px var(--f-t); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ph .pic{ width:40px; height:40px; flex:none; }
  .pb{ flex:1; overflow-y:auto; padding:4px max(14px, env(safe-area-inset-left,0px)) 18px; display:flex; flex-direction:column; gap:10px; }
  .row{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:18px; background:var(--glass); border:1px solid var(--line); text-align:left; width:100%; }
  .row .pic{ width:46px; height:46px; flex:none; }
  .row .t{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .row .t b{ font:700 16px var(--f-t); }
  .row .t small{ color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
  .row .n{ min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--red); color:#fff; font:800 12px/22px var(--f-b); text-align:center; }
  .row.new{ border-color:rgba(255,201,60,.45); background:rgba(255,201,60,.08); }
  .empty{ margin:auto; text-align:center; color:var(--mute); max-width:260px; padding:24px 0; }
  .h3{ font:800 11px var(--f-b); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin:8px 2px 0; }

  /* the conversation */
  .msgs{ flex:1; overflow-y:auto; padding:8px max(14px, env(safe-area-inset-left,0px)) 10px; display:flex; flex-direction:column; gap:6px; }
  .m{ max-width:80%; padding:9px 13px; border-radius:20px; border-bottom-left-radius:6px; background:#2b211a; align-self:flex-start; white-space:pre-wrap; word-wrap:break-word; animation:up .25s ease-out both; }
  /* the bank's texts: a receipt, square and readable */
  .m.momo{ max-width:88%; background:#14231a; border:1.5px solid #2FB36B; border-radius:14px; font:700 14px/1.45 var(--f-b); color:#dff5e6; font-variant-numeric:tabular-nums; }
  .m.me{ align-self:flex-end; background:var(--mango); color:var(--ink); border-bottom-left-radius:20px; border-bottom-right-radius:6px; font-weight:700; }
  .m.sys{ align-self:center; background:none; color:var(--mute); font-size:12px; font-weight:800; padding:4px; }
  .msgs .day{ align-self:center; margin:8px 0 2px; padding:3px 10px; border-radius:99px; background:rgba(255,246,220,.08); color:var(--mute); font:800 10.5px var(--f-b); letter-spacing:.08em; text-transform:uppercase; }
  .m .hr{ display:block; margin-top:3px; font:700 10px var(--f-b); opacity:.6; text-align:right; }
  /* a hot question has a fuse: the bar empties while she waits for your answer */
  #appChoices.fuse::before{ content:''; display:block; height:4px; border-radius:99px; background:var(--red); transform-origin:left; animation:fuse 20s linear forwards; margin-bottom:6px; }
  @keyframes fuse{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }

  /* ---------- the film: plan after plan, like the opening of a movie (same grammar as the Dossiers de Nkolbisson) ---------- */
  .film{ position:absolute; inset:0; z-index:40; background:#000; overflow:hidden; cursor:pointer; }
  .film .bg{ position:absolute; inset:-4%; background:center/cover no-repeat; opacity:0; transform:scale(1.1); transition:opacity 1.4s ease, transform 9s linear; }
  .film .bg.on{ opacity:1; transform:scale(1); }
  .film .bar{ position:absolute; left:0; right:0; height:0; background:#000; z-index:5; transition:height 1.6s cubic-bezier(.7,0,.2,1); }
  .film .bar.t{ top:0; } .film .bar.b{ bottom:0; } .film.on .bar{ height:9%; }
  .film .vig{ position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(120% 80% at 50% 45%, transparent 35%, rgba(0,0,0,.85) 100%); }
  .film .who{ position:absolute; bottom:9%; height:62%; z-index:2; opacity:0; transform:translateY(18px); transition:opacity 1.3s ease, transform 2.4s cubic-bezier(.2,.7,.2,1); filter:drop-shadow(0 0 28px rgba(255,70,150,.45)); }
  .film .who.on{ opacity:1; transform:none; }
  .film .who.c{ left:0; right:0; margin:0 auto; max-width:96%; object-fit:contain; } .film .who.l{ left:-14%; height:47%; } .film .who.r{ right:-14%; height:47%; }
  .film .who.rall{ height:auto; width:46%; aspect-ratio:1; bottom:30%; left:27%; border-radius:50%; object-fit:cover; border:3px solid rgba(255,201,60,.8); filter:none; }
  .shot{ position:absolute; left:0; right:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:0 26px; text-align:center;
    top:12%; bottom:12%; opacity:0; filter:blur(8px); transform:scale(1.04); transition:opacity 1.2s ease, filter 1.5s ease, transform 7s linear; pointer-events:none; }
  .shot.low{ justify-content:flex-end; } .shot.high{ justify-content:flex-start; }
  /* the last plan sits under Amour's face, on the dark of the street */
  .shot.ttl.low{ bottom:9%; padding-bottom:58px; background:linear-gradient(180deg, transparent 55%, rgba(5,3,6,.92) 75%); }
  .shot.ttl.low .n{ font-size:clamp(40px, 12vw, 52px); }

  .shot .nr b{ color:var(--mango); }

  .shot.ttl .k{ font:800 12px/1 var(--f-b); letter-spacing:.42em; color:var(--mango); text-transform:uppercase; }
  .shot.ttl .n{ font:700 clamp(50px, 16vw, 70px)/.92 var(--f-t); color:var(--mango); -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:0 6px 0 var(--ink), 0 0 40px rgba(255,201,60,.35); }
  .shot.ttl .s{ font:700 16px/1.3 var(--f-b); color:var(--cream); text-shadow:0 2px 8px #000; }
  .shot.ttl button{ pointer-events:auto; margin-top:10px; opacity:0; transition:opacity 1s 1.4s; } .shot.ttl.on button{ opacity:1; }
  .film .skip{ position:absolute; z-index:6; right:14px; bottom:calc(9% + 10px); padding:8px 12px; border:0; background:none; color:rgba(255,246,220,.6); font:800 12px/1 var(--f-b); letter-spacing:.2em; text-transform:uppercase; }
  .film .dots{ position:absolute; z-index:6; left:50%; bottom:calc(9% + 18px); transform:translateX(-50%); display:flex; gap:6px; }
  .film .dots i{ width:5px; height:5px; border-radius:50%; background:rgba(255,246,220,.25); transition:background .4s; } .film .dots i.on{ background:var(--mango); }
  .snd{ position:absolute; z-index:45; top:calc(8px + env(safe-area-inset-top,0px)); right:10px; width:38px; height:38px; border-radius:50%; border:2px solid var(--line); background:rgba(5,3,6,.55); color:var(--cream); font-size:17px; }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  /* ===================== polish (23/10): motion and depth, transform and opacity only ===================== */
  /* one easing for everything that moves: quick to start, soft to land */
  :root{ --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.35,.45,1); }
  /* a screen arrives instead of appearing */
  .scene.enter{ animation:sceneIn .32s var(--ease) both; }
  @keyframes sceneIn{ from{ opacity:0; transform:translateY(10px) scale(.99); } }
  .scene.page.enter{ animation-name:pageIn; }
  @keyframes pageIn{ from{ opacity:0; transform:translateX(24px); } }
  /* the home screen's cards come in one after the other */
  .home.enter .home-body > *{ animation:cardIn .42s var(--spring) both; }
  .home.enter .home-body > :nth-child(2){ animation-delay:.04s; } .home.enter .home-body > :nth-child(3){ animation-delay:.08s; }
  .home.enter .home-body > :nth-child(4){ animation-delay:.12s; } .home.enter .home-body > :nth-child(5){ animation-delay:.16s; }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(14px) scale(.98); } }
  /* depth: a warm light on top of the paper cards, a softer shadow under them */
  .w{ background-image:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 42%); }
  .w-million{ position:relative; overflow:hidden; }
  .w-million::after{ content:''; position:absolute; top:0; bottom:0; width:40%; left:-60%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); animation:sheen 7s ease-in-out 2s infinite; pointer-events:none; }
  @keyframes sheen{ 0%, 80%{ transform:translateX(0); } 100%{ transform:translateX(420%); } }
  /* every button answers the finger: it sinks, then springs back */
  .btn, .act, .app .ic, .w-time, .w-sis, .w-stat, .w-news, .row{ transition:transform .16s var(--ease), box-shadow .16s var(--ease); }
  .w-time:active, .w-sis:active, .w-stat:active, .w-news:active, .row:active{ transform:scale(.98); }
  .app:active .ic{ transform:translateY(3px) scale(.96); }
  /* the sheet: the room darkens, then the card slides up with a small bounce */
  .sheet:not([hidden]){ animation:dim .25s ease both; }
  @keyframes dim{ from{ background:rgba(0,0,0,0); } }
  .sheet .in{ animation:sheetUp .38s var(--spring) both; box-shadow:0 -12px 40px rgba(0,0,0,.35); }
  .sheet .in::before{ content:''; align-self:center; width:42px; height:5px; border-radius:99px; background:rgba(27,18,12,.18); margin:-8px 0 2px; }
  @keyframes sheetUp{ from{ transform:translateY(40%); opacity:.4; } }
  /* a new badge pops */
  .badge.pop{ animation:pop .45s var(--spring); }
  /* the banner of a message drops with a little weight */
  .notif.on{ animation:notifIn .45s var(--spring); }
  @keyframes notifIn{ from{ transform:translateY(-140%); } }
  /* the living map: places with something to do breathe */
  .map .pin circle[fill="#2FB36B"]{ transform-box:fill-box; transform-origin:center; animation:breathe 1.8s ease-in-out infinite; }
  @keyframes breathe{ 50%{ transform:scale(1.18); } }
  .map .me circle{ transform-box:fill-box; transform-origin:center; animation:breathe 2.4s ease-in-out infinite; }
  /* the present moment glows in the time strip */
  .tm-strip i.now{ animation:nowGlow 2.2s ease-in-out infinite; }
  @keyframes nowGlow{ 50%{ box-shadow:0 0 0 3px rgba(255,201,60,.35); } }
  .tm-mom span.now{ transition:background .3s; }
  /* action cards lift a little when they appear in a list */
  .acts .act{ animation:cardIn .36s var(--spring) both; }
  .acts .act:nth-child(2){ animation-delay:.03s; } .acts .act:nth-child(3){ animation-delay:.06s; } .acts .act:nth-child(n+4){ animation-delay:.09s; }
  /* messages: mine slide from the right, theirs from the left */
  .m{ animation-name:msgIn; } .m.me{ animation-name:msgMe; }
  @keyframes msgIn{ from{ opacity:0; transform:translateX(-10px) scale(.97); } }
  @keyframes msgMe{ from{ opacity:0; transform:translateX(10px) scale(.97); } }
  /* phones that ask for less motion get almost none */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    .w-million::after{ display:none; }
  }
</style>

<script>
(()=>{
'use strict';
const M = (()=>{
// Zéro à Héros · the engine (steps M1-M2 of « la mécanique du jeu », with the rules validated after the audit on 22/10).
// Pure rules, no screen: the same file runs in the phone, in the test page and in the automatic tester (node).
// One game = one plain object (the save). Every change goes through the functions below; every number lives in REGLES,
// so the balance can be tuned in one place with the tester.

const REGLES = {
  jours: 30, depart: 3500,
  // the hospital: the advance covers admission and the first 10 days of bed; then the bed is billed on days 14, 21 and 28
  avance: 50000, avanceAvant: 10, litApres: 10, lit: 2000, factureJours: [14, 21, 28], factureDelai: 3, delaiNegocie: 5, delaiRelation: 50,
  operation: 1000000, crise: 20000, criseDelai: 2, crisesMax: 2, crisesEcart: 5, rappelsOperation: [20, 25, 28, 30],
  // Princesse's health, every morning in this order: illness, late bill, strength from the relation; never more than 8 lost a day
  santeDepart: 64, maladie: 1, retardSoins: 3, perteMax: 8, crisePerte: 15, visiteSante: 2,
  // her relation
  relationDepart: 70, visiteRelation: 6, promesseRelation: 10, boudeVisite: 3, sansVisite: 4, silenceRelation: 2, reponseRelation: 2,
  relationForte: 70, relationBoude: 40, relationRefus: 20, cadeauMin: 2000,
  // the partner
  amourDepart: 70, orageDepart: 30,
  // the police
  chaleurNuit: 3, chaleurCalme: 3, controle: 40, rafle: 70, rafleEcart: 4, arrestation: 100, amendeRafle: 10000,
  // the small job: the safety net, mornings only, and only when you are nearly broke
  boulot: 1500, boulotPlafond: 10000,
  // the registration of the Maison: half now, half kept on your first winnings there
  inscription: 5000, inscriptionAcompte: 2500,
  // the moneylender: 10 % of the capital for each full 7 days; late, +5 % a day, at most +50 %; two loans at a time
  usure: 0.10, retardJour: 0.05, retardMax: 0.5, gvDelai: 7, gvMax: 2, renouvellement: 0.20, saisie: 3, tabac: 6, mort: 10, mortSeuil: 30000,
  // the tontine (savings, not income)
  cotisation: 1000, tours: 10,
  // Bosco's bar: 50 000 a share, 2 000 a day per share, 4 shares at most; the entrepreneur ending from 150 000 earned there
  barPart: 50000, barJour: 3000, barParts: 4, entrepreneur: 150000,
  // the big moments (option 1): the Saturday tournaments grow with the acts; the Grand Tournament; Penalty covers the rest
  tournoiEntree: [3000, 10000, 25000, 50000], tournoiPrix: [20000, 60000, 150000, 500000], grandEntree: 100000, grandPrix: 500000,
  // the neighbourhood helps (option 3): a collection on day 22, from 50 000 to 250 000 with your relation and your reputation
  collecteJour: 22, collecteBase: 50000, collecteRelation: 4000, collecteRep: 3000, collecteMax: 400000,
  // Hubert pays part of the operation, only if your reputation counts, in exchange for a « service »
  hubertPart: 600000, hubertRep: 60, hubertJour: 19,
  // the reputation that opens the rooms
  repSalle2: 30, repSalons: 45,
  // the legal chances of the first two weeks (validated 22/10): Mado's big fish, RALL's bet, Christelle's salon, the tontine's 2nd turn
  coupsLegaux: true,
};

// the places and their tables. joueurs: how many put the stake in the pot; force: the chance an average player wins it.
// quick: played « vite » with a computed result (the small tables); the others are real games in the real game.
const TABLES = {
  veillee: {nom:'Veillée de Mvog-Ada', mises:[200, 500, 1000], moments:[2], joueurs:3, coupe:0, force:0.34, rep:1, quick:true, ouverte:s=> true},
  boncoin: {nom:'Bar Le Bon Coin', mises:[1000, 2000, 3000], moments:[1, 2], joueurs:2, coupe:0, force:0.5, rep:1, quick:true, ouverte:s=> s.jour>=2},
  commune: {nom:'La Maison · salle commune', mises:[2000, 3500, 5000], moments:[2, 3], joueurs:4, coupe:0.10, force:0.26, rep:4, ouverte:s=> s.membre},
  salle2: {nom:'La Maison · salle 2', mises:[10000, 15000, 25000], moments:[2, 3], joueurs:4, coupe:0.10, force:0.25, rep:6, ouverte:s=> s.membre && (s.rep>=REGLES.repSalle2 || s.f.recoMado)},
  salons: {nom:'Salons de Bastos', mises:[50000, 75000, 100000], moments:[3], joueurs:6, coupe:0.10, force:0.17, rep:6, ouverte:s=> s.rep>=REGLES.repSalons && s.f.invitation},
};
const MOMENTS = ['Matin', 'Après-midi', 'Soir', 'Nuit'];
const JOURS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
const jourNom = j=> JOURS[(j - 1) % 7];
const clamp = v=> Math.max(0, Math.min(100, Math.round(v)));
const VERSION = 3;

// a seeded random, so a game (and a test) can be replayed exactly
function hasard(seed){ let s = (seed >>> 0) || 1; return ()=> ((s = (s*1664525 + 1013904223) >>> 0) / 4294967296); }

// ===================== a new game, and old saves =====================
function nouvellePartie(o = {}){
  const R = REGLES;
  return {
    v:VERSION, jour:1, m:2, fin:null, femme:!!o.femme, nom:o.nom || (o.femme ? 'Nadia' : 'Junior'), graine:o.graine || 1,
    cash:R.depart, registre:[{a:R.depart, l:'Ce qu’il te reste', j:1, m:2}],
    hop:{factures:[], lit:0, avance:0, operation:false, financement:null, crise:null, crises:0, derniereCrise:-99, date:false, delaiUtilise:false},
    sis:{sante:R.santeDepart, relation:R.relationDepart, derniereVisite:1, promesse:0, aRepondre:0, geste:false},
    amour:{love:R.amourDepart, orage:R.orageDepart, rupture:false, demande:null},
    chaleur:0, rep:0, membre:false, examen:false, veillee:false, inscriptionDue:0,
    dettes:[], tontine:null, bar:{parts:0, gagne:0}, legal:0, sale:0,
    cellule:0, tabassage:0, billet:false, grandTournoi:null, derniereRafle:-99, risque:-99,
    f:{}, journal:[], fait:{}, inbox:[],
  };
}
// a save from an older version keeps its money and its days
function migrer(s){
  if(!s || s.v===VERSION) return s;
  const n = nouvellePartie({femme:s.femme, nom:s.nom});
  for(const k of ['jour', 'm', 'cash', 'registre', 'chaleur', 'rep', 'membre', 'examen', 'veillee', 'dettes', 'tontine', 'f', 'fait', 'journal']) if(s[k]!=null) n[k] = s[k];
  if(s.sis) Object.assign(n.sis, s.sis); if(s.amour) Object.assign(n.amour, s.amour); if(s.hop) Object.assign(n.hop, s.hop);
  return n;
}

// ===================== money: one ledger, every token goes through here =====================
function argent(s, montant, libelle, qui, sale){
  if(!montant) return 0;
  s.cash += montant; s.registre.unshift({a:montant, l:libelle, j:s.jour, m:s.m, qui:qui || null});
  if(montant > 0 && sale) s.sale += montant;
  if(qui) dire(s, 'momo', (montant > 0 ? 'Transfert reçu' : 'Paiement effectué')+' · '+fmt(Math.abs(montant))+' F', {montant, de:qui, libelle, solde:s.cash});
  return montant;
}
const fmt = n=> Math.round(n).toLocaleString('fr-FR').replace(/ | /g, ' ');
// what happened, for the screen (messages, banners, receipts)
function dire(s, qui, texte, extra){ s.inbox.push(Object.assign({qui, texte, j:s.jour, m:s.m}, extra||{})); s.journal.push('J'+s.jour+' '+MOMENTS[s.m]+' · '+qui+' · '+texte); }
// winnings at the Maison first pay what is left of the registration
function gainMaison(s, net, libelle){
  if(s.inscriptionDue > 0){ const r = Math.min(s.inscriptionDue, net); s.inscriptionDue -= r; net -= r; if(r) s.journal.push('J'+s.jour+' · Maison · '+fmt(r)+' retenus pour l’inscription'); }
  if(net) argent(s, net, libelle);
}

// ===================== what you can do now (one action per moment; paying is free) =====================
function actions(s){
  if(s.fin) return [];
  const R = REGLES, A = [], m = s.m;
  if(s.cellule > 0) return [{id:'attendre', nom:'Attendre en cellule', moment:true}];
  if(s.tabassage > 0) return [{id:'attendre', nom:'Te soigner (tu as été passé à tabac)', moment:true}];
  // Princesse: no visit in intensive care, or while she refuses to see you
  const refuse = s.sis.relation < R.relationRefus && !s.sis.geste;
  if(m <= 1 && s.sis.sante >= 15 && !refuse) A.push({id:'visite', nom:'Rendre visite à Princesse', lieu:'hopital', moment:true});
  if(refuse && s.cash >= R.cadeauMin) A.push({id:'cadeau', nom:'Envoyer un cadeau à Princesse · '+fmt(R.cadeauMin), libre:true, cout:R.cadeauMin});
  // the safety net
  // with almost nothing left, the market also hires in the afternoon: never a day without something to do
  if((m===0 && s.cash < R.boulotPlafond) || (m===1 && s.cash < 1000)) A.push({id:'boulot', nom:'Petit boulot à Mokolo · '+fmt(R.boulot), lieu:'mokolo', moment:true});
  // the tables that are open now
  for(const [id, t] of Object.entries(TABLES)) if(t.moments.includes(m) && t.ouverte(s)) t.mises.forEach(mise=>{ if(mise <= s.cash) A.push({id:'table', table:id, mise, nom:t.nom+' · mise '+fmt(mise), lieu:id, moment:true}); });
  // the story gates: always a second chance
  if(!s.veillee && m===2 && s.jour>=2) A.push({id:'veillee', nom:'Veillée chez RALL (ouvre l’examen)', lieu:'mvogada', moment:true});
  if(s.veillee && !s.examen && m===0) A.push({id:'examen', nom:'Examen de la Maison'+(s.f.examenRate && s.cash >= 1000 ? ' · 1 000 pour repasser' : ''), lieu:'maison', moment:true});
  if(s.examen && !s.membre && m>=2 && s.cash >= R.inscriptionAcompte) A.push({id:'inscription', nom:'Inscription à la Maison · '+fmt(Math.min(s.cash, R.inscription))+(s.cash < R.inscription ? ' (le reste sur tes gains)' : ''), lieu:'maison', moment:true});
  // the Saturday tournament
  const w = Math.min(3, Math.max(0, Math.floor((s.jour - 6)/7))), entree = R.tournoiEntree[w];
  if(s.membre && m===2 && jourNom(s.jour)==='samedi' && !s.fait['tournoi'+s.jour] && s.cash >= entree) A.push({id:'tournoi', nom:'Tournoi du samedi · entrée '+fmt(entree)+' · '+fmt(R.tournoiPrix[w])+' au vainqueur', lieu:'maison', moment:true, cout:entree});
  // the Grand Tournament, days 28 to 30
  if(s.jour>=28 && m===2 && !(s.grandTournoi && s.grandTournoi.fini)){
    if(!s.grandTournoi && s.jour===28 && (s.billet || s.cash >= R.grandEntree)) A.push({id:'grand', nom:'Grand Tournoi · '+(s.billet ? 'ton billet gratuit' : 'entrée '+fmt(R.grandEntree)), lieu:'santa', moment:true});
    else if(s.grandTournoi && s.grandTournoi.tour===s.jour - 28) A.push({id:'grand', nom:'Grand Tournoi · '+['qualifications', 'demi-finale', 'finale'][s.grandTournoi.tour], lieu:'santa', moment:true});
  }
  // free things: paying, borrowing, the operation
  const f = s.hop.factures.find(x=> !x.payee);
  if(f && s.cash > 0) A.push({id:'payerFacture', nom:'Payer la facture de l’hôpital · '+fmt(f.reste), libre:true, cout:f.reste});
  if(f && !s.hop.delaiUtilise && s.sis.relation > R.delaiRelation) A.push({id:'delai', nom:'Demander un délai de '+R.delaiNegocie+' jours au Docteur Nitcheu', libre:true});
  if(s.hop.avance < R.avance && s.cash >= 1000) A.push({id:'payerAvance', nom:'Verser sur l’avance ('+fmt(s.hop.avance)+' / '+fmt(R.avance)+')', libre:true});
  if(s.hop.crise && !s.hop.crise.payee && s.cash >= R.crise) A.push({id:'payerCrise', nom:'Payer l’urgence de Princesse · '+fmt(R.crise), libre:true, cout:R.crise});
  if(!s.hop.operation && s.hop.date && s.cash >= R.operation) A.push({id:'operation', nom:'Payer l’opération · '+fmt(R.operation), libre:true, cout:R.operation});
  s.dettes.filter(d=> du(s, d) > 0).forEach(d=>{
    A.push({id:'rembourser', dette:d.id, nom:'Rembourser '+d.nom+' · '+fmt(Math.min(s.cash, du(s, d))), libre:true});
    if(d.taux && !d.renouvelee && s.jour <= d.echeance) A.push({id:'renouveler', dette:d.id, nom:'Repousser l’échéance de '+R.gvDelai+' jours (+20 %)', libre:true});
  });
  if(s.dettes.filter(d=> d.qui==='grosventre' && du(s, d) > 0).length < R.gvMax) A.push({id:'emprunter', qui:'grosventre', nom:'Emprunter à Papa Gros-Ventre (10 % par semaine)', libre:true});
  if(!s.tontine && s.jour>=3 && s.jour<=12) A.push({id:'tontine', nom:'Entrer dans la tontine de Clarisse (1 000 par jour, 10 000 à ton tour)', libre:true});
  if(s.jour>=9 && s.cash >= R.barPart && s.bar.parts < R.barParts) A.push({id:'bar', nom:'Racheter une part du bar de Bosco · '+fmt(R.barPart), libre:true, cout:R.barPart});
  // the legal chances of the first two weeks
  if(R.coupsLegaux){
    if(m===2 && s.jour>=5 && s.jour<=8 && !s.fait.poisson && s.cash >= 2000) A.push({id:'poisson', nom:'Avec Mado contre un gros commerçant · mise 2 000, 15 000 à gagner', lieu:'boncoin', moment:true});
    if(m===2 && s.jour>=10 && s.jour<=13 && !s.fait.pariRall && s.cash >= 5000) A.push({id:'pariRall', nom:'Le pari à deux de RALL · mise 5 000, 15 000 à gagner', lieu:'mvogada', moment:true});
    if(m===1 && s.jour>=4 && s.jour<=14 && (s.fait.salon || 0) < 5) A.push({id:'salon', nom:'Aider Christelle au salon · 2 500', lieu:'mvogada', moment:true});
    if(!s.tontine && s.jour>=3 && s.jour<=5 && s.cash >= 2000) A.push({id:'tontine2', nom:'Tontine : acheter le 2e tour (2 000), 10 000 dans 2 jours', libre:true});
  }
  // the dirty business: Armand's envelope, his suitcase, Hubert's « service »
  if(s.membre && m===1 && s.jour>=5 && s.jour<=8 && !s.fait.enveloppe) A.push({id:'enveloppe', nom:'Porter l’enveloppe d’Armand · 10 000', lieu:'mokolo', moment:true, sale:true});
  if(s.fait.enveloppe && m===1 && s.jour>=9 && s.jour<=16 && !s.fait.valise) A.push({id:'valise', nom:'Porter la valise d’Armand · 30 000', lieu:'bastos', moment:true, sale:true});
  if(s.jour>=R.hubertJour && !s.hop.operation && !s.f.serviceHubert && s.hop.date && s.rep >= R.hubertRep) A.push({id:'hubert', nom:'Accepter le « service » d’Hubert : '+fmt(R.hubertPart)+' pour l’opération', libre:true, sale:true});
  A.push({id:'repos', nom:m===3 ? 'Dormir' : 'Te reposer', moment:true});
  return A;
}

// ===================== doing it =====================
// In the game, a real table returns its result through o.gagne; in « quick » mode and in the tester the result is computed
// from the table's strength (to be replaced by the measured chances).
function agir(s, a, o = {}){
  const R = REGLES, rnd = o.rnd || Math.random, r = {texte:''};
  const prend = ()=> avancer(s);
  switch(a.id){
    case 'visite': {
      const promis = s.sis.promesse===s.jour, boude = s.sis.relation < R.relationBoude;
      s.sis.relation = clamp(s.sis.relation + (promis ? R.promesseRelation : boude ? R.boudeVisite : R.visiteRelation)); s.sis.sante = clamp(s.sis.sante + R.visiteSante);
      s.sis.derniereVisite = s.jour; s.sis.geste = false;
      r.texte = promis ? 'Elle t’attendait, coiffée. « Tu as tenu parole. »' : boude ? 'Elle regarde le mur. « Tu es venu'+(s.femme ? 'e' : '')+', enfin. »' : 'Elle dort. Tu poses ta main sur la sienne. Elle ouvre un œil : « Tu es venu'+(s.femme ? 'e' : '')+'. »';
      prend(); break; }
    case 'cadeau': argent(s, -R.cadeauMin, 'Cadeau pour Princesse', 'princesse'); s.sis.geste = true; s.sis.relation = clamp(s.sis.relation + 5); r.texte = '« … Merci. Tu peux passer demain. »'; break;
    case 'boulot': argent(s, R.boulot, 'Petit boulot · Mokolo'); r.texte = 'Tu portes des sacs de riz toute la matinée. '+fmt(R.boulot)+' F, et le dos en compote.'; prend(); break;
    case 'table': { const res = table(s, a.table, a.mise, o.gagne != null ? o.gagne : rnd() < TABLES[a.table].force + (o.bonus || 0)); r.texte = res; prend(); break; }
    case 'veillee': {
      s.veillee = true; const g = o.gagne != null ? o.gagne : rnd() < 0.5 + (o.bonus || 0);
      if(s.cash >= 500) argent(s, g ? 500 : -500, 'Veillée chez RALL · '+(g ? 'pot gagné' : 'mise perdue'));
      r.texte = 'RALL te glisse une carte : « Demain matin, la Maison. Le jury te fait passer l’examen. »'; prend(); break; }
    case 'examen': {
      if(s.f.examenRate && s.cash >= 1000) argent(s, -1000, 'Maison · repasser l’examen');
      const ok = o.reussi != null ? o.reussi : rnd() < 0.7;
      if(ok){ s.examen = true; r.texte = 'Maître Tsala soupire : « Bon. Tu peux t’inscrire. »'; }
      else { s.f.examenRate = true; r.texte = 'Raté. Tsala ricane. Tu peux repasser demain matin.'; }
      prend(); break; }
    case 'inscription': { const v = Math.min(s.cash, R.inscription); argent(s, -v, 'Maison · inscription'); s.inscriptionDue = R.inscription - v; s.membre = true; s.rep = Math.max(s.rep, 10);
      r.texte = s.inscriptionDue ? 'Te voilà membre. Tsala : « Le reste, je le prends sur tes gains. »' : 'Te voilà membre de la Maison.'; prend(); break; }
    case 'tournoi': r.texte = tournoi(s, rnd, o); prend(); break;
    case 'grand': r.texte = grandTournoi(s, rnd, o); prend(); break;
    case 'payerFacture': { const f = s.hop.factures.find(x=> !x.payee); const v = Math.min(s.cash, o.montant || f.reste); argent(s, -v, 'Hôpital · facture du jour '+f.jour, 'hopital'); f.reste -= v; if(f.reste<=0) f.payee = true; r.texte = f.payee ? 'Facture réglée.' : 'Versé : '+fmt(v)+' F. Il reste '+fmt(f.reste)+' F.'; break; }
    case 'delai': { const f = s.hop.factures.find(x=> !x.payee); f.echeance += R.delaiNegocie; s.hop.delaiUtilise = true; dire(s, 'mengue', 'Je vous accorde '+R.delaiNegocie+' jours. Une seule fois.'); r.texte = 'Délai accordé.'; break; }
    case 'payerAvance': { const v = Math.min(s.cash, o.montant || (R.avance - s.hop.avance), R.avance - s.hop.avance); argent(s, -v, 'Hôpital · avance d’admission', 'hopital'); s.hop.avance += v;
      if(s.hop.avance >= R.avance && !s.hop.date){ s.hop.date = true; dire(s, 'mengue', 'L’avance est réglée. L’opération est fixée au jour 30. Il faudra le million d’ici là.'); }
      r.texte = 'Versé : '+fmt(v)+' F.'; break; }
    case 'payerCrise': argent(s, -R.crise, 'Hôpital · urgence', 'hopital'); s.hop.crise.payee = true; s.sis.sante = clamp(s.sis.sante + 10); r.texte = 'Les soins d’urgence sont payés. Elle respire mieux.'; break;
    case 'operation': argent(s, -R.operation, 'Hôpital · l’opération de Princesse', 'hopital'); payerOperation(s); r.texte = 'L’opération est payée.'; break;
    case 'rembourser': { const d = s.dettes.find(x=> x.id===a.dette), v = Math.min(s.cash, o.montant || du(s, d), du(s, d)); d.paye += v; argent(s, -v, 'Remboursement · '+d.nom, d.qui); r.texte = 'Remboursé : '+fmt(v)+' F.'; break; }
    case 'renouveler': { const d = s.dettes.find(x=> x.id===a.dette); d.capital = Math.round(d.capital*(1 + R.renouvellement)); d.echeance += R.gvDelai; d.renouvelee = true; r.texte = '« 😊 Sept jours de plus. Et 20 % pour ma patience. »'; break; }
    case 'emprunter': { const v = o.montant || 10000; s.dettes.push({id:'gv'+s.jour+'_'+s.m+'_'+s.dettes.length, qui:'grosventre', nom:'Papa Gros-Ventre', capital:v, paye:0, jour:s.jour, taux:R.usure, echeance:s.jour + R.gvDelai});
      argent(s, v, 'Prêt de Papa Gros-Ventre', 'grosventre'); r.texte = '« Voilà mon fils 😊 Tu me rends ça dans 7 jours. »'; break; }
    case 'tontine': s.tontine = {debut:s.jour, tour:o.tour || R.tours, paye:0, touche:false, actif:true}; r.texte = 'Clarisse : « Bienvenue dans la famille 🙏 »'; break;
    case 'bar': argent(s, -R.barPart, 'Part du bar de Bosco', 'bosco'); s.bar.parts++; r.texte = 'Bosco te serre la main : « Associé. »'; break;
    case 'enveloppe': s.fait.enveloppe = 1; s.risque = s.jour; argent(s, 10000, 'Armand · « livraison »', null, true); s.chaleur = clamp(s.chaleur + 15); s.f.calme = false; r.texte = 'Dix mille pour une enveloppe. Trop facile.'; prend(); break;
    case 'valise': { s.fait.valise = 1; s.risque = s.jour; s.chaleur = clamp(s.chaleur + 20); s.f.calme = false;
      // one time out of three it goes wrong: half is missing, and Armand says it is you
      if(rnd() < 0.3){ const v = Math.min(s.cash, 30000); argent(s, -v, 'Armand · la moitié manquante'); r.texte = 'Il manque la moitié. Armand te fait payer.'; }
      else { argent(s, 30000, 'Armand · la valise', null, true); r.texte = 'La valise est arrivée. 30 000.'; }
      prend(); break; }
    case 'hubert': s.f.serviceHubert = 1; argent(s, R.hubertPart, 'Hubert Ondoua · « pour ta sœur »', 'hubert', true); s.chaleur = clamp(s.chaleur + 10);
      if(s.rep >= 60 && !s.f.invitation){ s.f.invitation = true; } r.texte = '« Tu me devras une nuit. »'; break;
    case 'poisson': { s.fait.poisson = 1; const g = o.gagne != null ? o.gagne : rnd() < 0.5 + (o.bonus || 0); argent(s, g ? 15000 : -2000, 'Avec Mado · '+(g ? 'le gros poisson est tombé' : 'perdu')); s.rep = clamp(s.rep + (g ? 6 : 1)); r.texte = g ? 'Mado rit : « On refait ça quand tu veux. »' : 'Le commerçant repart avec vos mises.'; prend(); break; }
    case 'pariRall': { s.fait.pariRall = 1; const g = o.gagne != null ? o.gagne : rnd() < 0.5 + (o.bonus || 0); argent(s, g ? 15000 : -5000, 'Pari avec RALL · '+(g ? 'gagné' : 'perdu')); r.texte = g ? 'RALL te prend dans ses bras.' : 'RALL : « La prochaine fois. »'; prend(); break; }
    case 'salon': s.fait.salon = (s.fait.salon || 0) + 1; argent(s, 2500, 'Salon de Christelle'); s.legal += 2500; r.texte = 'Tu tiens la caisse du salon. 2 500.'; prend(); break;
    case 'tontine2': argent(s, -2000, 'Tontine · achat du 2e tour', 'clarisse'); s.tontine = {debut:s.jour, tour:2, paye:0, touche:false, actif:true}; r.texte = 'Clarisse : « Tour 2, c’est noté. »'; break;
    case 'attendre': case 'repos': r.texte = a.id==='repos' ? (s.m===3 ? 'Tu dors.' : 'Tu souffles un peu.') : 'Le temps passe.'; prend(); break;
  }
  fins(s);
  return r;
}
// where the money of the operation came from decides the ending: more than half dirty money means you owe
function payerOperation(s, garant){
  s.hop.operation = true;
  s.hop.financement = garant || (s.sale > REGLES.operation/2 ? 'sale' : 'propre');
}

// a table, quickly: the pot, the house's cut, reputation and, at night, the police
function table(s, id, mise, gagne){
  const t = TABLES[id], nuit = s.m===3;
  if(nuit){ s.chaleur = clamp(s.chaleur + REGLES.chaleurNuit); s.f.calme = false; s.risque = s.jour; }
  // above 40, the night tables are searched: one time out of two the stake is seized
  if(nuit && s.chaleur >= REGLES.controle && (s.jour + s.m) % 2===0){ argent(s, -mise, t.nom+' · mise saisie par la police'); return 'Contrôle de police. Ta mise est saisie.'; }
  if(gagne){ const net = Math.round(mise*t.joueurs*(1 - t.coupe)) - mise; if(t.coupe) gainMaison(s, net, t.nom+' · gagné'); else argent(s, net, t.nom+' · gagné'); s.rep = clamp(s.rep + t.rep); return 'Gagné : +'+fmt(net)+' F.'; }
  argent(s, -mise, t.nom+' · perdu'); if(!t.coupe) s.rep = clamp(s.rep - 1); return 'Perdu : −'+fmt(mise)+' F.';
}
function tournoi(s, rnd, o){
  const R = REGLES, w = Math.min(3, Math.max(0, Math.floor((s.jour - 6)/7))), entree = R.tournoiEntree[w], prix = R.tournoiPrix[w];
  s.fait['tournoi'+s.jour] = 1; argent(s, -entree, 'Maison · entrée du tournoi');
  // in the game the two rounds are real games: o.manches = [semi-final won?, final won?]
  const p = 0.5 + (o.bonus || 0), M = o.manches || [];
  const demi = M[0] != null ? M[0] : o.gagne != null ? o.gagne : rnd() < p, finale = demi && (M[1] != null ? M[1] : o.gagne != null ? o.gagne : rnd() < p);
  if(!finale){ s.rep = clamp(s.rep + (demi ? 6 : 2)); return demi ? 'Éliminé en finale.' : 'Éliminé en demi-finale.'; }
  gainMaison(s, prix, 'Maison · tournoi du samedi gagné'); s.rep = clamp(s.rep + 20);
  if(s.jour===27){ s.billet = true; return 'Vainqueur ! +'+fmt(prix)+' F, et ton billet pour le Grand Tournoi.'; }
  return 'Vainqueur du tournoi ! +'+fmt(prix)+' F.';
}
// three rounds, one a day; winning the final pays the prize, and Penalty covers what is missing for the operation
function grandTournoi(s, rnd, o){
  const R = REGLES;
  if(!s.grandTournoi){ if(!s.billet) argent(s, -R.grandEntree, 'Grand Tournoi · entrée'); s.grandTournoi = {tour:0, fini:false}; }
  const g = s.grandTournoi, ok = o.gagne != null ? o.gagne : rnd() < 0.5 + (o.bonus || 0) - g.tour*0.05;
  if(!ok){ g.fini = true; g.perdu = true; return ['Éliminé en qualifications.', 'Éliminé en demi-finale.', 'Penalty gagne la finale.'][g.tour]; }
  g.tour++;
  if(g.tour===3){ g.fini = true; g.gagne = true; argent(s, R.grandPrix, 'Grand Tournoi · vainqueur'); s.rep = 100;
    if(!s.hop.operation){ if(s.hop.date && s.cash >= R.operation){ argent(s, -R.operation, 'Hôpital · l’opération de Princesse', 'hopital'); payerOperation(s); }
      else { const v = Math.min(s.cash, R.operation); argent(s, -v, 'Hôpital · l’opération (Penalty garantit le reste)', 'hopital'); s.hop.date = true; payerOperation(s, 'penalty'); dire(s, 'penalty', 'Je garantis le reste à l’hôpital. Tu me le rendras… en revanche.'); } }
    return 'Tu bats Penalty. '+fmt(R.grandPrix)+' F.'; }
  return ['Qualifié pour la demi-finale.', 'Qualifié pour la finale contre Penalty.'][g.tour - 1];
}

// what a debt is worth today: 10 % of the capital for each full 7 days; late, +5 % a day of what is due, at most +50 %
function du(s, d){
  const R = REGLES, semaines = Math.floor((s.jour - d.jour)/7);
  let v = d.capital*(1 + (d.taux || 0)*semaines);
  const retard = Math.max(0, s.jour - d.echeance); if(retard && d.taux) v *= 1 + Math.min(R.retardMax, R.retardJour*retard);
  return d.solde ? 0 : Math.max(0, Math.round(v - d.paye));
}

// ===================== time: a moment passes; at the end of the night a new day starts =====================
function avancer(s){
  if(s.fin) return;
  if(s.m < 3){ s.m++; return; }
  // the day's message of Princesse left without an answer
  if(s.sis.aRepondre){ s.sis.relation = clamp(s.sis.relation - REGLES.silenceRelation); s.sis.aRepondre = 0; }
  s.m = 0; s.jour++;
  // after the night of day 30, the story ends: no new morning
  if(s.jour > REGLES.jours){ fins(s); return; }
  if(s.cellule > 0) s.cellule--;
  if(s.tabassage > 0) s.tabassage--;
  matin(s);
}

// every morning the world turns on its own, always in this order
function matin(s){
  const R = REGLES, j = s.jour;
  // 1. the hospital: the bed after the advance's 10 days, the bills of days 14, 21 and 28
  if(j > R.litApres) s.hop.lit += R.lit;
  if(R.factureJours.includes(j) && s.hop.lit){ s.hop.factures.push({jour:j, montant:s.hop.lit, reste:s.hop.lit, echeance:j + R.factureDelai, payee:false}); dire(s, 'mengue', 'Facture du lit : '+fmt(s.hop.lit)+' F, à régler avant le jour '+(j + R.factureDelai)+'.'); s.hop.lit = 0; }
  // 2. Princesse's health: illness, late bill (once, in proportion to what is left), strength from the relation; at most 8 lost
  const late = s.hop.factures.filter(f=> !f.payee && j > f.echeance);
  let d = -R.maladie;
  if(late.length){ const reste = late.reduce((x, f)=> x + f.reste, 0), total = late.reduce((x, f)=> x + f.montant, 0); d -= Math.ceil(R.retardSoins*reste/total); dire(s, 'mengue', 'La facture n’est pas réglée. Nous réduisons ses soins.'); }
  if(s.sis.relation > R.relationForte) d += 1;
  d = Math.max(-R.perteMax, d);
  if(s.hop.crise && !s.hop.crise.payee && j > s.hop.crise.echeance){ d -= R.crisePerte; s.hop.crise.payee = true; dire(s, 'mengue', 'L’urgence n’a pas été payée. Son état s’est aggravé.'); }
  s.sis.sante = clamp(s.sis.sante + d);
  // 3. a crisis when she falls under 40: two at most, never two within 5 days
  if(s.sis.sante < 40 && s.hop.crises < R.crisesMax && j - s.hop.derniereCrise >= R.crisesEcart && !(s.hop.crise && !s.hop.crise.payee)){
    s.hop.crises++; s.hop.derniereCrise = j; s.hop.crise = {echeance:j + R.criseDelai, payee:false};
    dire(s, 'mengue', 'Princesse a fait une crise cette nuit. Il faut '+fmt(R.crise)+' F de soins d’urgence d’ici '+R.criseDelai+' jours.'); }
  if(s.sis.sante < 15 && !s.f.alerte15){ s.f.alerte15 = true; dire(s, 'mengue', 'Elle est en soins intensifs. Plus de visites. Je suis désolé.'); }
  if(j > R.avanceAvant && !s.hop.date && !s.f.avanceRetard){ s.f.avanceRetard = true; dire(s, 'mengue', 'Sans l’avance, je ne peux pas programmer l’opération. Chaque jour compte.'); }
  if(R.rappelsOperation.includes(j) && !s.hop.operation) dire(s, 'mengue', 'Rappel : l’opération est prévue au jour 30. '+(s.hop.date ? 'Il manque '+fmt(Math.max(0, R.operation - s.cash))+' F.' : 'L’avance n’est toujours pas payée.'));
  // 4. her relation: two days without a visit; today's message
  if(j - s.sis.derniereVisite >= 2) s.sis.relation = clamp(s.sis.relation - R.sansVisite);
  s.sis.aRepondre = 1; dire(s, 'princesse', MESSAGES_PRINCESSE[(j - 1) % MESSAGES_PRINCESSE.length], {quotidien:true});
  // 5. the police: a calm day cools down; a raid at most every 4 days, only after a risk taken the day before; arrest at 100
  if(s.f.calme !== false) s.chaleur = clamp(s.chaleur - R.chaleurCalme); s.f.calme = true;
  if(s.amour.love >= 80 && s.amour.orage < 30 && !s.amour.rupture && j % 7===0){ s.chaleur = clamp(s.chaleur - 10); dire(s, 'pamela', 'J’ai fait effacer ton nom d’une liste. Ne me demande pas laquelle.'); }
  if(s.chaleur >= R.arrestation) arrestation(s);
  else if(s.chaleur >= R.rafle && j - s.derniereRafle >= R.rafleEcart && s.risque===j - 1){ s.derniereRafle = j; s.cellule = 1; argent(s, -Math.min(s.cash, R.amendeRafle), 'Amende · rafle'); s.chaleur = clamp(s.chaleur - 20); dire(s, 'poste', 'Rafle. Une nuit en cellule, et l’amende.'); }
  // 6. the debts, the oldest first: reminder, chasers, seizure, beating, then death above 30 000 (seizure below)
  s.dettes.slice().sort((a, b)=> a.echeance - b.echeance).forEach(d=>{
    const v = du(s, d); if(v <= 0 || !d.taux) return;
    const retard = j - d.echeance;
    if(retard===-1) dire(s, 'grosventre', 'Demain, c’est le jour 😊 '+fmt(v)+' F.');
    if(retard>=1 && retard < R.saisie) dire(s, 'grosventre', 'Mon fils 😊 Tu as oublié quelque chose ? '+fmt(v)+' F aujourd’hui.');
    if(retard===R.saisie){ const x = Math.min(v, Math.round(s.cash*0.3)); if(x){ argent(s, -x, 'Saisie des garçons de Gros-Ventre'); d.paye += x; } dire(s, 'grosventre', 'Mes garçons sont passés. Ce n’est qu’un début 😊'); }
    if(retard===R.tabac){ s.tabassage = 1; dire(s, 'grosventre', 'On t’a cherché. On t’a trouvé. Dernier avertissement. '+(v > R.mortSeuil ? 'La prochaine fois, c’est le Mfoundi.' : '')); }
    if(retard===R.mort - 2 && v > R.mortSeuil) dire(s, 'grosventre', 'Deux jours. Après, je ne réponds plus de rien.');
    if(retard >= R.mort){ if(v > R.mortSeuil) s.fin = 'tragique-toi'; else { const x = Math.min(v, s.cash); if(x) argent(s, -x, 'Gros-Ventre se paie lui-même'); d.solde = true; s.rep = clamp(s.rep - 20); dire(s, 'grosventre', 'On est quittes. Tout le quartier sait ce que tu vaux.'); } }
  });
  // 7. the tontine: your turn pays the pot; you keep paying until the end
  const t = s.tontine;
  if(t && t.actif){
    if(j===t.debut + t.tour && !t.touche){ t.touche = true; argent(s, R.cotisation*R.tours, 'Tontine · ton tour', 'clarisse'); }
    else if(j > t.debut + R.tours) t.actif = false;
    else if(s.cash >= R.cotisation){ t.paye++; argent(s, -R.cotisation, 'Tontine · cotisation', 'clarisse'); }
    else { s.rep = clamp(s.rep - 3); dire(s, 'clarisse', 'Tu n’as pas cotisé ce matin.'); }
  }
  // 8. Bosco's bar pays every day
  if(s.bar.parts){ const g = s.bar.parts*R.barJour; s.bar.gagne += g; s.legal += g; argent(s, g, 'Part du bar de Bosco', 'bosco'); }
  // 9. the neighbourhood's collection (option 3): legal money that rewards the relation and the reputation
  if(j===R.collecteJour){ const v = Math.min(R.collecteMax, R.collecteBase + R.collecteRelation*Math.max(0, s.sis.relation - 50) + R.collecteRep*s.rep);
    s.legal += v; argent(s, v, 'Collecte du quartier pour Princesse', 'quartier'); dire(s, 'christelle', 'Le quartier s’est cotisé pour Princesse. '+fmt(v)+' F. L’église, le marché, la tontine… tout le monde.'); }
  // 10. the partner asks for money every 3 days; Ornella's invitation to the salons

// A scene waits for its window (days, moments) and its conditions, plays once, and never blocks: when its window closes
// without it, the story goes on by another path (the scene's « sinon »). The phone plays the scene; the engine decides when.
// j: [first day, last day]; m: the moments; si: the condition; apres: a door that must have played before.

  {id:'d4m0', j:[4, 6], m:[0, 1]},

function portesOuvertes(s){
  s.joue = s.joue || {};
  return PORTES.filter(p=> !s.joue[p.id] && s.jour >= p.j[0] && s.jour <= p.j[1] && p.m.includes(s.m) && (!p.apres || s.joue[p.apres]) && (!p.si || p.si(s))).map(p=> p.id);

function preter(s, qui, nom, montant, taux, delai){
  s.dettes.push({id:qui+s.jour+'_'+s.m+'_'+s.dettes.length, qui, nom, capital:montant, paye:0, jour:s.jour, taux:taux || 0, echeance:s.jour + (delai || 7)});

// the jauges a scene moves, always within 0 and 100
function jauge(s, quoi, d){
  if(quoi==='relation') s.sis.relation = clamp(s.sis.relation + d);
  if(quoi==='sante') s.sis.sante = clamp(s.sis.sante + d);
  if(quoi==='love') s.amour.love = clamp(s.amour.love + d);
  if(quoi==='orage') s.amour.orage = clamp(s.amour.orage + d);
  if(quoi==='chaleur'){ s.chaleur = clamp(s.chaleur + d); if(d > 0){ s.f.calme = false; s.risque = s.jour; } }

// During the game: Princesse's health at 0, a debt above 30 000 ten days late, an arrest with nobody to get you out.
// On the evening of day 30: the operation decides everything.
function fins(s){
  if(s.fin) return s.fin;
  if(s.sis.sante <= 0){ s.fin = 'tragique-elle'; return s.fin; }
  if(s.chaleur >= REGLES.arrestation) arrestation(s);
  if(s.fin) return s.fin;

}

let RUN = 0;
// someone writes: typing dots when the thread is open, a banner when it isn't
async function say(id, lines, choices, gap){
  const run = RUN, th = thread(id); bump(id);
  for(const txt of lines){
    if(openThread===id){ showTyping(true); await wait(gap ? gap + txt.length*8 : 700 + Math.min(1600, txt.length*22)); showTyping(false); }
    else await wait(gap || 900);
    if(run!==RUN) return;
    th.msgs.push({who:'them', txt, d:S.jour, m:S.m});
    if(openThread!==id){ th.unread++; banner(id, txt); }
    save(); if(openThread===id) drawThread(); renderHome();
  }
  if(choices){ th.choices = choices; save(); if(openThread===id) drawThread(); }
}

// ---- never in a loop: a line is only said again once 20 other lines of hers have passed ----
function pick(pid, pool){
  const recent = new Set(thread(pid).msgs.filter(m=> m.who==='them').slice(-20).map(m=> m.txt));
  const fresh = (pool || []).filter(l=> !recent.has(l));
  return fresh.length ? fresh[Math.floor(Math.random()*fresh.length)] : null;
}

async function freeSend(pid, text){
  text = String(text||'').replace(/\s+/g, ' ').trim().slice(0, 200); if(!text) return;
  const th = thread(pid);
  // writing freely while she waits for an answer counts as your answer
  if(th.choices){ th.choices = null; th.pressed = 0; clearTimeout(drawThread.t); }
  th.msgs.push({who:'me', txt:text, d:S.jour, m:S.m}); save(); drawThread(); renderHome();
  const book = CHAT[pid], k = detect(text), e = book[k] || book.unknown;
  const mood = S.amour.orage>=65 ? 's' : S.amour.orage>=45 ? 't' : 'c';
  // a conversation has an end: after a few exchanges in the same moment she has other things to do, and says so once
  S.flags.chatN = S.flags.chatN || {}; const ck = pid+'_'+S.jour+'_'+S.m, n = S.flags.chatN[ck] = (S.flags.chatN[ck] || 0) + 1;
  if(n > 6){ save(); if(n===7){ await wait(700); await say(pid, [pick(pid, BYE[pid][mood] || BYE[pid].c) || 'On se parle plus tard.']); } return; }
  // what she already knows about you comes first, once per memory
  const known = e.know ? Object.keys(e.know).find(m=> knows(m) && !(S.flags.said||{})[pid+k+m]) : null;
  let lines;
  if(known){ S.flags.said = S.flags.said || {}; S.flags.said[pid+k+known] = 1; lines = [e.know[known]]; }
  else {
    // never a line she said recently: first her answer for this meaning, then something else in the same mood, then she changes the subject
    const pool = e[mood] || e.c;
    const a = pick(pid, pool) || pick(pid, (e.c || []).concat(e.t || [], e.s || [])) || pick(pid, SUBJECT[pid][mood] || SUBJECT[pid].c) || pick(pid, SUBJECT[pid].c);
    lines = [a || '…'];
    // in a storm she fires a second line, if she has a new one
    if(mood==='s'){ const b = pick(pid, pool); if(b) lines.push(b); }
  }
  pam(e.fx[0], e.fx[1]); if(e.mem) remember(e.mem);
  await wait(500);
  if(mood==='s') await burst(pid, lines); else await say(pid, lines);
}

function echeances(){
  const E = [], h = S.hop, j = S.jour, add = (jour, t, s, ic, hot, m)=>{ if(jour >= j && jour <= R.jours) E.push({jour, m:m==null ? -1 : m, t, s, ic, hot:!!hot}); };
  if(!h.date) add(Math.max(j, R.avanceAvant), 'Avance de l’hôpital', 'Il reste '+fmt(R.avance - h.avance)+(j > R.avanceAvant ? ' · EN RETARD' : ' · sans elle, pas d’opération'), '🏥', true);
  h.factures.filter(f=> !f.payee).forEach(f=> add(Math.max(j, f.echeance), 'Facture du lit', fmt(f.reste)+(j > f.echeance ? ' · EN RETARD, ses soins baissent' : ''), '🏥', true));
  const nb = R.factureJours.find(x=> x > j); if(nb) add(nb, 'Facture du lit', 'Environ '+fmt(h.lit + R.lit*Math.max(0, nb - Math.max(j, R.litApres))), '🧾');

// money counts up or down instead of jumping: green when it comes, red when it goes (only while you look at it)
let shownCash = null, cashAnim = 0;
function countCash(){
  const el = $('#wCash'), to = S.cash, put = v=> el.innerHTML = fmt(v)+' <small>/ 1 000 000</small>';
  if($('#scHome').hidden) return;
  const from = shownCash==null ? to : shownCash; shownCash = to;
  if(from===to){ put(to); return; }
  cancelAnimationFrame(cashAnim); el.classList.remove('flash-up', 'flash-dn'); el.classList.add(to > from ? 'flash-up' : 'flash-dn');
  const t0 = performance.now(), dur = Math.min(1200, 400 + Math.abs(to - from)/50);
  const step = t=>{ const k = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1 - k, 3); put(Math.round(from + (to - from)*e));
    if(k < 1) cashAnim = requestAnimationFrame(step); else setTimeout(()=> el.classList.remove('flash-up', 'flash-dn'), 500); };
  cashAnim = requestAnimationFrame(step);
}

function drawThread(){
  const pid = openThread; if(!pid) return;
  const th = thread(pid), box = $('#appBody');
  th.unread = 0; save();
  // like a real messenger: a separator for each day and moment, the time under the last message of a group, and « Vu »
  let last = '', out = '';
  const lastMe = th.msgs.map(m=> m.who).lastIndexOf('me'), seen = lastMe >= 0 && th.msgs.slice(lastMe + 1).some(m=> m.who==='them');
  th.msgs.forEach((m, i)=>{
    const key = (m.d || 1)+'-'+(m.m || 0);
    if(key!==last){ last = key; out += '<div class="day">'+(m.d===S.jour ? 'Aujourd’hui' : m.d===S.jour - 1 ? 'Hier' : M.jourNom(m.d || 1).replace(/^./, c=> c.toUpperCase())+' · jour '+(m.d || 1))+' · '+MOMENTS[m.m || 0].toLowerCase()+'</div>'; }
    const nx = th.msgs[i + 1], end = !nx || nx.who!==m.who || (nx.d+'-'+nx.m)!==key;
    out += '<div class="m'+(m.who==='me' ? ' me' : '')+(m.k ? ' '+m.k : '')+'">'+esc(m.txt)+(end ? '<small class="hr">'+CLOCK[m.m || 0]+(i===lastMe && seen ? ' · Vu' : '')+'</small>' : '')+'</div>';
  });
  box.innerHTML = out || '<div class="empty">Pas encore de message.</div>';
  box.scrollTop = box.scrollHeight;
  const c = $('#appChoices');
  if(th.choices && th.choices.length){
    c.hidden = false; c.innerHTML = '<span class="lab">Ta réponse</span>';
    th.choices.forEach(ch=>{ const b = document.createElement('button'); b.textContent = ch.t;
      // an answer that costs money stays visible but locked when you can't pay: you see what you can't afford
      if(ch.need && S.cash < ch.need){ b.disabled = true; b.style.opacity = '.5'; b.textContent += ' · il te manque '+fmt(ch.need - S.cash); }
      else b.onclick = ()=> answer(pid, ch);
      c.appendChild(b); });
    // Amour hates waiting: an open conversation left unanswered for 20 s gets a jab, once per question
    clearTimeout(drawThread.t); c.classList.remove('fuse');
    if(pid==='pamela' && !th.pressed){ void c.offsetWidth; c.classList.add('fuse'); drawThread.t = setTimeout(()=>{ if(openThread==='pamela' && thread('pamela').choices && !thread('pamela').pressed){ thread('pamela').pressed = 1; pam(0, +4); say('pamela', [pick('pamela', hot() ? ['Tu écris la Bible ou quoi ?? 😤', 'Réponds. MAINTENANT.', 'Je vois que tu es en ligne.'] : ['Tu écris un roman ? 🙄', 'Allô ? 😒', 'Tu réfléchis trop, ça me fait peur.']) || '…']); } }, 20000); }
  } else { c.hidden = true; c.classList.remove('fuse'); }
  // the free-writing bar lives outside the redrawn part, so what you are typing is never wiped by her next message
  $('#appFree').hidden = !CHAT[pid];
  if(CHAT[pid] && th.choices) c.querySelector('.lab').textContent = 'Ta réponse · ou écris ce que tu veux en bas';
}
async function answer(pid, ch){
  const th = thread(pid); th.choices = null; th.pressed = 0; clearTimeout(drawThread.t); th.msgs.push({who:'me', txt:ch.t, d:S.jour, m:S.m}); save(); drawThread(); renderHome();
  // any answer to Princesse is the answer the engine waits for that day
  if(pid==='princesse'){ M.repondrePrincesse(S); save(); renderHome(); }
  await ANSWERS[ch.a]();
  // the partner's request waited for the scene to end: it comes back now
  const d = pid===PART() && !thread(pid).choices && demandChoices();
  if(d){ thread(pid).choices = d; save(); if(openThread===pid) drawThread(); }
}

// ===================== time: one action per moment; the engine moves the clock, the phone catches up =====================
// act() does what the player chose (the engine applies the rules and, if it takes the moment, moves the clock). moved()
// then shows what happened: the black card of the new moment, the messages of the morning, the doors of the story that
// open now, a missed meeting that comes back, and the end when it has come.
function act(a, o){ if(!fxBefore) fxBefore = etat(); const r = M.agir(S, a, o || {}); save(); return r; }
// ---- what an action changed, made visible: small chips float up on the home screen ----
const etat = ()=> ({cash:S.cash, sante:S.sis.sante, relation:S.sis.relation, rep:S.rep, chaleur:S.chaleur});
const FX_NOM = {cash:['', ' F'], sante:['Santé ', ''], relation:['Relation ', ''], rep:['Réputation ', ''], chaleur:['Police ', '']};
let fxBefore = null;
function floatFx(from){
  if(!from) return; const box = $('#fxs'), to = etat(), out = [];
  for(const k of Object.keys(FX_NOM)){ const d = to[k] - from[k]; if(!d) continue;
    // for the police, going up is bad news
    const good = k==='chaleur' ? d < 0 : d > 0;
    out.push('<span class="fx '+(good ? 'up' : 'dn')+'">'+FX_NOM[k][0]+(d > 0 ? '+' : '−')+fmt(Math.abs(d))+FX_NOM[k][1]+'</span>'); }
  if(!out.length) return;
  box.innerHTML = out.join(''); clearTimeout(floatFx.t); floatFx.t = setTimeout(()=> box.innerHTML = '', 3000);
}
// ---- the day's summary, at the first light of the next one: what yesterday did, what today asks ----
function resumeJour(){
  const d0 = S.flags.debutJour; S.flags.debutJour = Object.assign(etat(), {jour:S.jour}); save();
  if(!d0 || d0.jour!==S.jour - 1) return;
  const now = etat(), row = (k, lab, unit, invert)=>{ const d = now[k] - d0[k]; if(!d) return ''; const good = invert ? d < 0 : d > 0;
    return '<span>'+lab+'</span><em style="color:'+(good ? 'var(--green)' : 'var(--red)')+'">'+(d > 0 ? '+' : '−')+fmt(Math.abs(d))+(unit || '')+'</em>'; };
  const rows = row('cash', '💰 Argent', ' F')+row('sante', '❤️ Santé de Princesse')+row('relation', '🤝 Votre relation')+row('rep', '⭐ Réputation')+row('chaleur', '🚨 Police', '', true);
  const today = echeances().filter(e=> e.jour - S.jour <= 1);
  sheet('<h3>Hier, jour '+d0.jour+'</h3>'+(rows ? '<div class="card"><div class="bill">'+rows+'</div></div>' : '<p class="story">Une journée sans rien de changé. Le temps, lui, a passé.</p>')+
    '<div class="card"><span class="k">Aujourd’hui · jour '+S.jour+' ('+M.jourNom(S.jour)+')</span>'+(today.length ? today.map(e=> '<div class="cal-row"><span class="when'+(e.hot ? ' hot' : '')+'">'+quand(e)+'</span><span>'+e.ic+'</span><span style="flex:1;min-width:0"><b>'+esc(e.t)+'</b><small>'+esc(e.s)+'</small></span></div>').join('') : '<span>Rien d’urgent. Profite-en pour avancer.</span>')+'</div>'+
    '<div class="btns"><button class="btn" id="rjGo">Commencer le jour '+S.jour+'</button></div>');
  $('#rjGo').onclick = closeSheet;
}
async function moved(fast){
  if(!S || !S.started) return;
  const now = S.jour+'-'+S.m, prev = S.vu, changed = prev!==now, newDay = changed && +prev.split('-')[0] !== S.jour;
  S.vu = now;
  let ghosted = false;
  if(changed){
    // leaving the partner on « Vu »: the moment passes without your answer, and that is an answer too
    const pt = S.threads[PART()]; ghosted = !!(pt && pt.choices);
    if(ghosted){ pt.choices = null; pt.pressed = 0; remember('ghosted'); if(PART()==='pamela') pam(-4, +15); else pam(-1, 0); if(S.amour.demande) M.repondreDemande(S, false); }
    busy = 1; save();
    // the black card says where you are: the day out of 30, the moment among the 4, and on a new day what is left
    const left = R.jours - S.jour, dots = MOMENTS.map((_, i)=> '<i style="display:inline-block;width:9px;height:9px;margin:0 4px;border-radius:50%;background:'+(i===S.m ? 'var(--mango)' : i < S.m ? '#7A6650' : '#333')+'"></i>').join('');
    const bl = $('#black'); bl.innerHTML = '<div><small>Jour '+S.jour+' / '+R.jours+(S.fin ? '' : ' · '+M.jourNom(S.jour))+'</small>'+MOMENTS[S.m]+
      '<div style="margin-top:10px">'+dots+'</div>'+(newDay && !S.fin && !S.hop.operation ? '<small style="margin:12px 0 0;color:#f6ead6">'+(left ? 'Opération dans '+left+' jour'+(left > 1 ? 's' : '') : 'Opération ce soir')+'</small>' : '')+'</div>'; bl.classList.add('on');
    await wait(fast ? 650 : newDay ? 1700 : 1100); bl.classList.remove('on'); busy = 0;
  }
  show('scHome'); curApp = null; openThread = null;
  flush();
  if(S.fin) return ending();
  // a new day opens on its summary; within a day, what the action changed floats up
  if(newDay) resumeJour(); else floatFx(fxBefore);
  fxBefore = null;
  if(ghosted) PART()==='pamela' ? burst('pamela', hot() ? ['Vu.', 'Tu as vu et tu ne réponds pas ?', 'Ok.', 'Tu vas voir.'] : ['Vu…', 'Bon. Ok. 😒']) : say('yowale', ['lol ok 😂']);
  // two days without a visit: she says it once (the engine already counts it in your relation)
  if(newDay && S.jour >= 4 && S.jour - S.sis.derniereVisite >= 2) talk = talk.then(()=> say('princesse', ['Tu m’as oubliée ?'])).catch(()=>{});
  agendaRoll(); renderHome();
  await doors();
}
// the doors of the story (engine, M3): each scene waits for its window and its conditions, plays once, never blocks
async function doors(){ for(const id of M.portesOuvertes(S)){ M.marquer(S, id); save(); await beat(id); } }
// a meeting is never « too late »: what the story needs comes back at the next occasion; a one-off missed has its consequence
const AG_RETRY = {veillee:2, examen:0, inscription:2};
const AG_DONE = {veillee:()=> S.veillee, examen:()=> S.examen, inscription:()=> S.membre};
const AG_MISSED = {
  bosco:()=>{ M.devoir(S, 'bosco', 'Bosco · les 3 000 du match', 3000, 2); talk = talk.then(()=> burst('bosco', ['Tu n’es pas venu'+G().e+'.', 'Mes 3 000. Après-demain. On ne fait pas attendre Bosco.'])); },
  colis:()=>{ dealSet('colis', 'abandonné', {who:'armand', title:'Le colis de Mokolo', pay:0}); remember('dropped_parcel'); talk = talk.then(()=> burst('armand', ['Le garçon en jaune vous a attendu.', 'Je n’aime pas les gens qui ne viennent pas.'])); },
  tournoi:()=>{ talk = talk.then(()=> say('tsala', ['Ta chaise est restée vide samedi.', 'Il y a un tournoi chaque samedi. Les lâches aussi ont droit à une deuxième chance.'])); },
};
function agendaRoll(){
  S.agenda.forEach(a=>{
    if(a.done) return;
    if(AG_DONE[a.id] && AG_DONE[a.id]()){ a.done = 1; return; }
    if(a.day > S.jour || (a.day===S.jour && a.m >= S.m)) return;
    if(a.id in AG_RETRY){ const m = AG_RETRY[a.id]; a.day = S.m <= m ? S.jour : S.jour + 1; a.m = m; return; }
    a.done = 1; if(AG_MISSED[a.id]) AG_MISSED[a.id](a);
  });
  save();
}
// the time is the player's: one moment at a time, or straight to the next meeting (nothing is skipped: each moment's news still arrives)
async function skipTo(day, m){
  while(!S.fin && (S.jour<day || (S.jour===day && S.m<m))) await advance(true);
}
// « ⏩ »: nothing else to do this moment, so you rest (in a cell or after a beating, you wait)
async function advance(fast, sure){
  if(busy || !S || S.fin) return;
  // before sleeping, the phone warns about what falls due tomorrow and is not paid yet
  if(!fast && !sure && S.m===3){
    const due = echeances().filter(e=> /🏥|🚑|💸/.test(e.ic) && e.jour - S.jour <= 1);

function examStart(){

  const mix = q=>{

  const seen = seenGet();

function examCheck(){
  const q = EX.qs[EX.i], ok = EX.sel===q.a; EX.done = true; clearTimeout(EX.idleT);

  const chosen = opts[EX.sel];
  if(ok){
    EX.score++; EX.byLvl[q.l]++; EX.streak++; EX.miss = 0; EX.best = Math.max(EX.best, EX.streak);
    [0, .07, .14, .22].forEach((t, k)=> tone([1047, 1319, 1568, 2093][k], t, .2, .06));
    celebrate(chosen, EX.streak);
  } else {
    EX.streak = 0; EX.miss = (EX.miss||0) + 1;

  // why: in plain words, with the cards drawn when it helps

  why.innerHTML = '<b>'+(ok ? 'Exactement.' : 'La bonne réponse : '+esc(good))+'</b>'+(ill ? illHtml(ill) : '')+'<p>'+esc(q.w)+'</p>';

// the reward: the answer jumps, confetti and coins fly out, "+1" rises; bigger on a streak
function celebrate(el, streak){
  if(!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // soft, not a firework: the answer fills with green, a ring breathes out, a few sparks drift up, "+1" floats away
  el.classList.add('fill');
  const host = $('#scExam'), hr = host.getBoundingClientRect(), r = el.getBoundingClientRect();
  const cx = r.left - hr.left + r.width/2;
  const ring = document.createElement('i'); ring.className = 'ring';
  ring.style.left = (r.left - hr.left)+'px'; ring.style.top = (r.top - hr.top)+'px'; ring.style.width = r.width+'px'; ring.style.height = r.height+'px';
  host.appendChild(ring);
  ring.animate([{transform:'scale(1)', opacity:.7}, {transform:'scale(1.06, 1.35)', opacity:0}], {duration:750, easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish = ()=> ring.remove();
  const n = streak>=5 ? 12 : streak>=3 ? 9 : 6, gold = streak>=3;
  for(let i = 0; i < n; i++){
    const p = document.createElement('i'); p.className = 'spark'+(gold ? ' gold' : '');
    p.style.left = ((r.left - hr.left) + r.width*(.15 + .7*Math.random()))+'px'; p.style.top = (r.top - hr.top + 6)+'px'; host.appendChild(p);
    const dx = (Math.random() - .5)*40, dy = -(40 + Math.random()*50);
    p.animate([{transform:'translate(-50%,-50%) scale(.2) rotate(0)', opacity:0}, {transform:'translate(calc(-50% + '+dx*.4+'px), calc(-50% + '+dy*.4+'px)) scale(1) rotate(45deg)', opacity:1, offset:.35},
      {transform:'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) scale(.4) rotate(90deg)', opacity:0}], {duration:1100 + Math.random()*400, delay:i*45, easing:'cubic-bezier(.25,.8,.35,1)', fill:'backwards'}).onfinish = ()=> p.remove();
  }
  const plus = document.createElement('b'); plus.className = 'plus1'; plus.textContent = streak>=3 ? '+1 · série '+streak : '+1';
  plus.style.left = cx+'px'; plus.style.top = (r.top - hr.top - 4)+'px'; host.appendChild(plus);
  plus.animate([{transform:'translate(-50%,6px)', opacity:0}, {transform:'translate(-50%,-10px)', opacity:1, offset:.3}, {transform:'translate(-50%,-34px)', opacity:0}], {duration:1400, easing:'cubic-bezier(.25,.8,.35,1)'}).onfinish = ()=> plus.remove();
  const bar = $('#exBar'); bar.classList.remove('glow'); void bar.offsetWidth; bar.classList.add('glow');
}
