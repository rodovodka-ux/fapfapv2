let AC = null, ringT = 0;
function audio(){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function tone(f, t0, d, v){ if(!SFX.on) return; const a = audio(); if(!a) return; const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0, a.currentTime+t0); g.gain.linearRampToValueAtTime(v, a.currentTime+t0+.02); g.gain.exponentialRampToValueAtTime(.001, a.currentTime+t0+d); o.connect(g); g.connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+d+.05); }
function ring(on){ clearInterval(ringT); if(!on) return; const r = ()=>{ [0, .18].forEach(t=>{ tone(880, t, .16, .08); tone(660, t+.09, .14, .06); }); buzz(); }; r(); ringT = setInterval(r, 1600); }
// each person has a ring of their own, so you know who writes before you look; the phone only vibrates once you touched it
// (browsers refuse it before, and filled the console with errors)
const RING = {pamela:[988, 1319], yowale:[784, 1047], princesse:[1568, 2093], grosventre:[392, 330], mengue:[880, 880], rall:[659, 988], momo:[1175, 1568]};
function buzz(who){
  try{ if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate([60, 40, 60]); }catch(e){}
  const [a, b] = RING[who] || [1320, 1760];
  if(SFX.on){ tone(a, 0, .12, .05); tone(b, .1, .14, .04); }
}
// ---- the real recordings of the game and of the Dossiers de Nkolbisson (sfx/ and sfx/amb/, CC0 / Kenney), loaded on first use.
// One-shots (thunder, chips, cards, a horn) and loops that fade in and out (rain, the bar, the siren). Missing files stay silent.
const SFX = (()=>{
  const FILES = {pluie:'sfx/amb/pluie_toit.mp3', orage:'sfx/amb/pluie_orage.mp3', tonnerre:'sfx/amb/tonnerre.mp3', sirene:'sfx/amb/sirene.mp3', klaxon:'sfx/amb/klaxon.mp3',
    bar:'sfx/amb/bar.mp3', insectes:'sfx/amb/insectes.mp3', jetons:'sfx/chips-stack-3.wav', jeton:'sfx/chip-lay-2.wav', melange:'sfx/card-shuffle.wav', carte:'sfx/card-place-2.wav', eventail:'sfx/card-fan-1.wav'};
  let on = true; try{ on = localStorage.getItem('zh-snd')!=='0'; }catch(e){}
  const buf = {}, loops = {};
  let bus = null;
  const ctx = ()=>{ const a = audio(); if(a && !bus){ bus = a.createGain(); bus.gain.value = on ? 1 : 0; bus.connect(a.destination); } return a; };
  const load = n=> buf[n] ? Promise.resolve(buf[n]) : fetch(FILES[n]).then(r=> r.ok ? r.arrayBuffer() : Promise.reject()).then(b=> new Promise((ok, no)=> ctx().decodeAudioData(b, ok, no))).then(b=> (buf[n] = b)).catch(()=> null);
  function play(n, vol, delay){ const a = ctx(); if(!a || !on) return; load(n).then(b=>{ if(!b) return; const s = a.createBufferSource(), g = a.createGain(); s.buffer = b; g.gain.value = vol==null ? .5 : vol; s.connect(g); g.connect(bus); s.start(a.currentTime + (delay||0)); }); }
  function loop(n, vol, fade){ const a = ctx(); if(!a || loops[n]) return; loops[n] = {pending:1};
    load(n).then(b=>{ const L = loops[n]; if(!b || !L || !L.pending) return; const s = a.createBufferSource(), g = a.createGain(); s.buffer = b; s.loop = true; g.gain.value = 0; s.connect(g); g.connect(bus);
      s.start(0, Math.random()*b.duration); g.gain.linearRampToValueAtTime(vol==null ? .25 : vol, a.currentTime + (fade||2)); loops[n] = {s, g}; }); }
  function stop(n, fade){ const L = loops[n]; if(!L) return; delete loops[n]; if(!L.g) return; const a = ctx(); L.g.gain.cancelScheduledValues(a.currentTime); L.g.gain.setValueAtTime(L.g.gain.value, a.currentTime); L.g.gain.linearRampToValueAtTime(0, a.currentTime + (fade||1.5)); setTimeout(()=>{ try{ L.s.stop(); }catch(e){} }, (fade||1.5)*1000 + 100); }
  function toggle(){ on = !on; try{ localStorage.setItem('zh-snd', on ? '1' : '0'); }catch(e){} const a = ctx(); if(bus && a) bus.gain.setTargetAtTime(on ? 1 : 0, a.currentTime, .1); $('#snd').textContent = on ? '🔊' : '🔇'; $('#snd').setAttribute('aria-label', on ? 'Couper le son' : 'Remettre le son'); }
  return {play, loop, stop, toggle, get on(){ return on; }};
})();
$('#snd').textContent = SFX.on ? '🔊' : '🔇';
$('#snd').onclick = e=>{ e.stopPropagation(); audio(); SFX.toggle(); };

// the Saturday tournament: a semi-final against Mado, a final against Armand
function tournoi(a){
  ambience('bar');

  const w = Math.min(3, Math.max(0, Math.floor((S.jour - 6)/7))), entry = R.tournoiEntree[w], prize = R.tournoiPrix[w];
  if(S.cash < entry){ sheet('<h3>Le tournoi du samedi</h3><p class="story">Maître Tsala tend la main : « '+fmt(entry)+'. »</p><p style="font-weight:800;color:var(--red)">Il te manque '+fmt(entry - S.cash)+'.</p><div class="btns"><button class="btn" id="tX">Partir</button></div>'); $('#tX').onclick = closeSheet; return; }
  sheet('<h3>Le tournoi du samedi</h3><p class="story">Seize joueurs, une seule table éclairée au milieu. Maître Tsala annonce les règles au micro, avec l’enthousiasme d’un croque-mort.</p>'+
    '<div class="card"><span class="k">Le tournoi</span><div class="bill"><span>Entrée</span><em>'+fmt(entry)+'</em><span>Demi-finale</span><em>contre Mado</em><span>Finale</span><em>?</em><span>Le vainqueur touche</span><em>'+fmt(prize)+'</em></div></div>'+
    '<div class="btns"><button class="btn green" id="tGo">Payer et jouer · prend la soirée</button><button class="btn ghost" id="tNo">Pas ce soir</button></div>');
  $('#tNo').onclick = closeSheet;
  // the engine settles the evening in one go: the entry, the prize, the reputation
  const finish = (manches, title, txt)=>{
    const c0 = S.cash; act({id:'tournoi'}, {manches}); if(manches[1]) remember('tournoi_won'); flush();

    sheet('<h3>'+title+'</h3><p class="story">'+txt+'</p><div class="delta"><span class="'+(net >= 0 ? 'up' : 'dn')+'">'+(net >= 0 ? '+' : '−')+fmt(Math.abs(net))+'</span><span>Solde : '+fmt(S.cash)+'</span></div>'+
      '<div class="btns"><button class="btn" id="tE">Retour au téléphone</button></div>');
    $('#tE').onclick = ()=>{ closeSheet(); moved(); };
  };
  const out = (manches, txt)=> finish(manches, 'Éliminé'+G().e, txt);
  const semi = async()=>{
    const r1 = await playTable({opp:'mado', name:'Mado', stake:entry, target:3, table:'tripot', title:'Tournoi · demi-finale contre Mado'});
    if(!r1.won) return out([false], 'Mado ramasse tes cartes avec un sourire de grand-mère. « Reviens quand tu auras grandi. »');
    ambience('bar');
    sheet('<h3>En finale</h3><p class="story">En face de toi s’assoit l’homme en costume. Il pose sa montre sur la table. « Armand Ondoua. Enchanté. Encore. »</p><div class="btns"><button class="btn green" id="tF">Jouer la finale</button></div>');
    $('#tF').onclick = async()=>{
      const r2 = await playTable({opp:'armand', name:'Armand Ondoua', stake:entry, target:3, table:'tripot', title:'Tournoi · finale contre Armand'});
      if(!r2.won) return out([true, false], 'Armand range ses gains sans les compter. « Vous jouez bien. Pas encore assez bien. »');
      finish([true, true], 'Vainqueur du tournoi', 'La salle se lève. Maître Tsala, pour la première fois, applaudit. Deux fois. Au fond, Hubert Ondoua te regarde sans sourire.'); };
  };
  $('#tGo').onclick = ()=>{ a.done = 1; save();
    // a promise made to Mado comes back right here
    if(knows('mado_deal')){
      sheet('<h3>Demi-finale contre Mado</h3><p class="story">Mado s’assoit en face de toi. Elle ne dit rien. Elle attend que tu tiennes parole.</p><div class="btns"><button class="btn" id="tKeep">Tenir parole : la laisser gagner</button><button class="btn red" id="tBreak">Jouer pour gagner</button></div>');
      $('#tKeep').onclick = ()=>{ remember('kept_mado'); out([false], 'Tu joues petit, exprès. Mado ramasse le pot et te serre la main sous la table. « Tu es quelqu’un de bien. C’est rare ici. »'); };
      $('#tBreak').onclick = ()=>{ S.flags.brokeMado = 1; save(); semi(); };
    } else semi(); };

// ===================== « Que faire ? »: everything the engine allows right now, in plain words =====================
// One thing per moment (a visit, a table, a job…); paying, borrowing or answering takes no time. The list comes from the
// engine, so the phone can never offer what the rules forbid, nor leave a moment with nothing to do.
const PLAY = {veillee:{opp:'rall', name:'RALL', table:'auvent'}, boncoin:{opp:'mado', name:'Mado', table:'zinc'}, commune:{opp:'costume', name:'L’homme en costume', table:'tripot'},
  salle2:{opp:'armand', name:'Armand Ondoua', table:'tripot'}, salons:{opp:'armand', name:'Armand Ondoua', table:'tripot'}};

PEOPLE.penalty = PEOPLE.penalty || {name:'Penalty', role:'Le champion de Santa Barbara', face:null};
PEOPLE.ornella = PEOPLE.ornella || {name:'Ornella', role:'Les salons de Bastos', face:null};

// what the story keeps for its own scenes: Armand's jobs only once you said yes, and through the agenda
const hidden = a=> (a.id==='enveloppe') || (a.id==='valise' && !(S.deals || []).some(d=> d.id==='valise' && d.state==='accepté'));
const agItem = id=> S.agenda.find(x=> x.id===id && !x.done) || {};
function quoiFaire(){
  if(busy || !S.started) return;
  if(S.fin) return ending();
  // the moment's actions, place by place, each a card with what it gives, risks and costs; then what takes no time
  const A = M.actions(S).filter(a=> !hidden(a)), byPlace = {}, libres = [];
  A.forEach((a, i)=>{ a.k = i; if(a.moment && a.id!=='repos' && a.id!=='attendre'){ const p = lieuDe(a) || 'ailleurs'; (byPlace[p] = byPlace[p] || []).push(a); } else if(a.libre) libres.push(a); });
  let h = '<h3>'+MOMENTS[S.m]+' · jour '+S.jour+' ('+M.jourNom(S.jour)+')</h3><p style="margin:0 0 6px;font-weight:700;color:#7A6650">Une seule chose par moment. Payer, emprunter ou répondre ne prend pas de temps.</p><div class="btns" style="max-height:62vh;overflow-y:auto">';
  Object.entries(byPlace).forEach(([p, list])=>{
    h += '<div class="lab qf">📍 '+esc(PLACES[p] ? PLACES[p].name : 'Ailleurs')+'</div><div class="acts">'+list.map(a=> carte(a, a.k)).join('')+'</div>'; });
  if(libres.length) h += '<div class="lab qf">💳 Sans perdre de temps</div><div class="acts">'+libres.map(a=> carte(a, a.k)).join('')+'</div>';
  h += '<div class="lab qf">Sinon</div><button class="btn" data-k="rest">'+(S.m===3 ? '🌙 Dormir jusqu’à demain' : '⏩ Laisser passer le moment')+'</button><button class="btn ghost" id="qfMap">🗺 Voir sur la carte</button><button class="btn ghost" id="qfX">Fermer</button></div>';
  sheet(h);

let FILM = null;
function film(list, done){
  const el = document.createElement('div'); el.className = 'film'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Cinématique');
  const bgs = [...new Set(list.map(p=> p.bg))];
  el.innerHTML = bgs.map(b=> '<div class="bg" data-bg="'+b+'" style="background-image:url('+ART+b+'.webp)"></div>').join('')+
    '<div class="vig"></div><div class="bar t"></div><div class="bar b"></div>'+
    list.map((p, i)=>{ const w = !p.who ? [] : Array.isArray(p.who[0]) ? p.who : [p.who];
      return w.map(([n, side])=> '<img class="who '+side+'" data-i="'+i+'" alt="" src="'+(n==='rall' ? 'art/rall.jpg' : ART+'buste-'+n+'.webp')+'">').join('')+
        '<div class="shot'+(p.ttl ? ' ttl' : '')+(p.pos ? ' '+p.pos : '')+'" aria-live="polite">'+p.html+'</div>'; }).join('')+
    '<div class="dots">'+'<i></i>'.repeat(list.length)+'</div><button type="button" class="skip">Passer ›</button>';
  $('#phone').appendChild(el);
  const shots = el.querySelectorAll('.shot'), dots = el.querySelectorAll('.dots i');
  let i = -1, t = 0, beep = 0, loopOn = null, ended = false;
  const go = k=>{ if(k >= list.length) return; clearTimeout(t); clearInterval(beep); i = k; const p = list[k];
    shots.forEach((s, j)=> s.classList.toggle('on', j===k)); dots.forEach((d, j)=> d.classList.toggle('on', j<=k));
    el.querySelectorAll('.bg').forEach(b=> b.classList.toggle('on', b.dataset.bg===p.bg));
    el.querySelectorAll('.who').forEach(w=> w.classList.toggle('on', +w.dataset.i===k));
    tone(49, 0, 2, .12);   // a low hit on every plan
    if(p.sfx){ if(p.sfx[0]==='bip') beep = setInterval(()=> tone(1046, 0, .12, .05), 1100); else SFX.play(p.sfx[0], p.sfx[1]); }
    if(p.loop !== loopOn){ if(loopOn) SFX.stop(loopOn); loopOn = p.loop || null; if(loopOn) SFX.loop(loopOn, .22); }
    if(k < list.length - 1) t = setTimeout(()=> go(k + 1), 2600 + shots[k].textContent.length*55);
    else el.querySelector('.skip').hidden = true; };
  const end = ()=>{ if(ended) return; ended = true; clearTimeout(t); clearInterval(beep); if(loopOn) SFX.stop(loopOn); SFX.stop('orage', 2);
    el.style.transition = 'opacity .9s'; el.style.opacity = '0'; setTimeout(()=>{ el.remove(); FILM = null; done && done(); }, 900); };
  el.addEventListener('click', e=>{ if(e.target.closest('[data-go]')) return end(); if(e.target.closest('.skip')) return go(list.length - 1); if(i < list.length - 1) go(i + 1); });
  FILM = {end};
  audio(); SFX.loop('orage', .2, 3);
  requestAnimationFrame(()=> el.classList.add('on')); setTimeout(()=> go(0), 700);
}

  M.argent(S, x.cash, 'Départ (mode développeur)'); delete x.cash; S.inbox = [];
  if(day>=2 || m>=2) S.agenda.push({id:'veillee', day:2, m:2, place:'mvogada', title:'Veillée chez RALL', who:'rall', stake:'Mises de 200 à 1 000'});
  const beats = x.beats || {}; delete x.beats;
  Object.assign(S, x); S.beats = beats; Object.keys(beats).forEach(b=> M.marquer(S, b));
  lastCash = S.cash; save();
  if(HOST) hostPost({zh:'set', chips:S.cash}); // in the game, the real chips follow the scene
  openThread = null; busy = 0; closeSheet(); show('scHome'); renderHome();
}
const BEATS = list=> Object.fromEntries(list.map(b=> [b, 1]));
const A1 = ['sis1', 'rall1', 'part1', 'day2am', 'part2', 'day2pm', 'part3'];
function devJump(k){
  if(k==='call'){ devState(1, 2); S.started = false; S.cash = lastCash = 0; S.registre = []; S.agenda = []; save(); opening(); return; }
  if(k==='night1'){ devState(1, 3, {beats:BEATS(['sis1', 'rall1'])}); M.marquer(S, 'part1'); beat('part1'); }
  if(k==='day2am'){ devState(2, 0, {beats:BEATS(['sis1', 'rall1', 'part1'])}); M.marquer(S, 'day2am'); beat('day2am'); }
  if(k==='day2pm'){ devState(2, 1, {mem:{lie_hosp:{d:1, m:3}}, beats:BEATS(['sis1', 'rall1', 'part1', 'day2am', 'part2'])}); M.marquer(S, 'day2pm'); beat('day2pm'); }
  if(k==='veillee'){ devState(2, 2, {beats:BEATS(A1)}); openApp('carte', 'veillee'); }
  if(k==='exam'){ devState(3, 0, {veillee:true, beats:BEATS(A1)}); examStart(); }
  if(k==='day3' || k==='inscription' || k==='debt'){
    devState(3, k==='day3' ? 1 : 2, {cash:4000, veillee:true, examen:true,
      agenda:[{id:'inscription', day:3, m:2, place:'maison', title:'Inscription à la Maison', who:'tsala', stake:fmt(R.inscriptionAcompte)+' à payer · puis ta première table'}],
      beats:BEATS(A1.concat(k==='day3' ? [] : ['day3money']))});
    if(k==='day3') doors();
    if(k==='inscription'){ borrow('grosventre', 10000, R.usure, R.gvDelai); remember('loan_gv'); openApp('carte', 'inscription'); }
    if(k==='debt'){ S.jour = 3; borrow('grosventre', 10000, R.usure, R.gvDelai); remember('loan_gv'); S.agenda[0].done = 1; S.membre = true; S.jour = 10; S.m = 3; S.vu = '10-3'; save(); advance(); }
  }
  if(/^a2/.test(k)) act2Jump(k);
}
// act 2 starts from a member of the Maison with 8 000, the advance paid, every act 1 moment already lived
function act2Jump(k){
  const at = {a2:[4, 0, 'd4m0'], a2d4pm:[4, 1, 'd4m1'], a2mado:[5, 0, 'd5m0'], a2armand:[5, 1, 'd5m1'], a2colis:[6, 1, null], a2tournoi:[6, 2, null], a2d7:[7, 0, 'd7m0'], a2end:[10, 3, 'd10m3'], a2endR:[10, 3, 'd10m3']}[k];
  const passed = Object.keys(ACT2).filter(b=>{ const [, d, m] = b.match(/d(\d+)m(\d)/).map(Number); return d < at[0] || (d===at[0] && m < at[1]); });
  const mem = {member:{d:3, m:2}, kept_deal:{d:4, m:2}};
  if(k==='a2end') Object.assign(mem, {delivered:{d:6, m:1}, opened_parcel:{d:6, m:1}});
  if(k==='a2endR') mem.refused_parcel = {d:5, m:1};
  if(k==='a2d7' && PART()==='pamela') mem.informer = {d:4, m:1};
  if(k==='a2d7' && PART()==='yowale') mem.daryl_loan2 = {d:4, m:1};
  const agenda = [];
  if(k==='a2colis') agenda.push({id:'colis', day:6, m:1, place:'mokolo', title:'Le colis d’Armand', who:'armand', stake:'10 000 à la livraison · ne l’ouvre pas'});
  if(k==='a2tournoi') agenda.push({id:'tournoi', day:6, m:2, place:'maison', title:'Tournoi du samedi', who:'tsala', stake:fmt(R.tournoiEntree[0])+' l’entrée · '+fmt(R.tournoiPrix[0])+' au vainqueur'});
  devState(at[0], at[1], {cash:8000, mem, agenda, veillee:true, examen:true, membre:true, rep:10,
    hop:Object.assign(fresh().hop, {avance:R.avance, date:true}), fait:k==='a2end' ? {enveloppe:1} : {},
    tontine:k==='a2d7' ? {debut:3, tour:10, paye:3, touche:false, actif:true} : null,
    beats:BEATS(A1.concat('day3money', passed))});
  S.contacts.push('tsala', 'mado', 'armand'); save();
  if(at[2]){ M.marquer(S, at[2]); beat(at[2]); }
  if(k==='a2d7') setTimeout(()=>{ M.marquer(S, 'd7m1'); beat('d7m1'); }, 9000);
  if(agenda.length) openApp('carte', agenda[0].id);
}
function devPanel(){
  sheet('<h3>🛠 Mode développeur</h3><p>Va directement à une scène. La partie en cours est remplacée.</p>'+
    '<div class="seg" id="devSex"><button type="button" data-f="0" aria-pressed="'+(!S.hero.fem)+'">Héros homme (Amour)</button><button type="button" data-f="1" aria-pressed="'+(!!S.hero.fem)+'">Héroïne (Daryl Bleu Magic)</button></div>'+

    '<div class="btns" style="max-height:46vh;overflow-y:auto">'+DEV_JUMPS.map(([k, l])=> '<button class="btn ghost" data-j="'+k+'" style="text-align:left">'+esc(l)+'</button>').join('')+
    '<button class="btn" id="devCash">+10 000 jetons</button><button class="btn ghost" id="devClose">Fermer</button></div>');

// ---- « back », from the game's back button, the system gesture or a slide from the left edge: one step at a time ----
function phoneBack(){
  const vis = id=> !$(id).hidden;
  const f = document.querySelector('.film'); if(f){ const s = f.querySelector('.skip'); (s || f).click(); return; }
  if(!$('#sheet').hidden){ closeSheet(); return; }
  if(vis('#scCall')) return;                                   // a call is answered or declined, never swiped away
  if(vis('#scExam')){ $('#exQuit').click(); return; }
  if(vis('#scApp')){ $('#appBack').click(); return; }
  if(vis('#scHero')){ show('scTitle'); return; }
  if(HOST) hostPost({zh:'close'});
}
(function swipeBack(){
  let top = window; try{ top = window.top; }catch(e){}
  const standalone = (top.navigator && top.navigator.standalone) || (top.matchMedia && top.matchMedia('(display-mode: standalone)').matches);
  if(!standalone || !('ontouchstart' in window)) return;
  const ind = document.createElement('div'); ind.className = 'swipe-back'; ind.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'; document.body.appendChild(ind);
  let x0 = 0, y0 = 0, on = false, dx = 0;
  document.addEventListener('touchstart', e=>{ const t = e.touches[0]; if(e.touches.length!==1 || t.clientX > 22) return; on = true; x0 = t.clientX; y0 = t.clientY; dx = 0; }, {passive:true});
  document.addEventListener('touchmove', e=>{ if(!on) return; const t = e.touches[0]; dx = t.clientX - x0; const dy = Math.abs(t.clientY - y0);
    if(dy > 60 && dy > dx){ on = false; ind.style.opacity = 0; return; }
    const k = Math.max(0, Math.min(1, dx/110)); ind.style.top = t.clientY+'px'; ind.style.transform = 'translateX('+(-60 + k*76)+'px)'; ind.style.opacity = k; ind.classList.toggle('go', k >= 1); }, {passive:true});
  document.addEventListener('touchend', ()=>{ if(!on) return; on = false; ind.style.opacity = 0; ind.style.transform = 'translateX(-60px)'; ind.classList.remove('go'); if(dx >= 110) phoneBack(); }, {passive:true});
})();

function suggestion(){

    '<div class="btns"><button class="btn green" id="sgGo">Envoyer</button><button class="btn ghost" id="sgX">Fermer</button></div>');
  $('#sgX').onclick = closeSheet;
  $('#sgGo').onclick = ()=>{ const t = $('#sgT').value.trim(); if(t.length < 3) return;
    try{ const q = JSON.parse(localStorage.getItem('fapfap_sugg_queue') || '[]'); q.push({texte:t.slice(0, 1000), categorie:'histoire', version:'v77', origine:'zero-heros', appareil:navigator.userAgent.slice(0, 200)}); localStorage.setItem('fapfap_sugg_queue', JSON.stringify(q.slice(-20))); }catch(e){}

}
